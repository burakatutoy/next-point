<style>

/* Layout: top bar with four roles (Courtside, Player, Referee, Admin); admin has sub-tabs; courts drawn as mini pickleball courts like the open play prototype */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#15201c; --muted:#5a6a63; --line:#d6dfda;
  --accent:#1d5a86; --accent-ink:#ffffff; --accent-soft:#dde9f2;
  --ball:#e3c726; --ball-soft:#fbf3c8; --ball-ink:#4a3f00;
  --court:#2f6f9a; --court-out:#3f7d5f; --good:#256b44; --good-soft:#dcefe3; --warn:#9c4614; --warn-soft:#f8e3d6; --bad:#b3261e; --bad-soft:#f6dcda;
  --gold:#b8901a; --silver:#7d8890; --bronze:#a2643a;
  --teamA:#cfe2f2; --teamA-ink:#123a57; --teamB:#f5dcc7; --teamB-ink:#5a2a0a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#17201e; --surface-2:#1c2624; --ink:#e4ebe8; --muted:#94a39c; --line:#2b3633;
  --accent:#6eaedc; --accent-ink:#0b1a24; --accent-soft:#1a2f3e;
  --ball:#e6cd3a; --ball-soft:#3a3412; --ball-ink:#f6eaa2;
  --court:#24577a; --court-out:#2c5a45; --good:#6cc391; --good-soft:#173628; --warn:#f0a06c; --warn-soft:#3e2516; --bad:#f08a82; --bad-soft:#3f1b19;
  --gold:#e0b84a; --silver:#b4bec5; --bronze:#d08a5c;
  --teamA:#24465f; --teamA-ink:#d6ebfa; --teamB:#553218; --teamB-ink:#fbe1cc;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#17201e; --surface-2:#1c2624; --ink:#e4ebe8; --muted:#94a39c; --line:#2b3633;
  --accent:#6eaedc; --accent-ink:#0b1a24; --accent-soft:#1a2f3e;
  --ball:#e6cd3a; --ball-soft:#3a3412; --ball-ink:#f6eaa2;
  --court:#24577a; --court-out:#2c5a45; --good:#6cc391; --good-soft:#173628; --warn:#f0a06c; --warn-soft:#3e2516; --bad:#f08a82; --bad-soft:#3f1b19;
  --gold:#e0b84a; --silver:#b4bec5; --bronze:#d08a5c;
  --teamA:#24465f; --teamA-ink:#d6ebfa; --teamB:#553218; --teamB-ink:#fbe1cc;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num,.clock,td{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.top .tabs{margin-left:auto}
.tab{border:1px solid transparent;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.subtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.subtabs .tab{border-radius:8px 8px 0 0;padding:8px 14px}
.subtabs .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom-color:var(--surface);margin-bottom:-1px}
.demo-note{background:var(--ball-soft);color:var(--ball-ink);font-size:12.5px}
.demo-note .wrap{padding-block:6px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
main.wrap{padding-block:18px 40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:#2a2400}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.big{padding:12px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-free,.p-queued,.p-open{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-called{background:var(--ball-soft);color:var(--ball-ink)}
.p-play,.p-live{background:var(--accent-soft);color:var(--accent)}
.p-hold{background:var(--warn-soft);color:var(--warn)}
.p-done,.p-ok{background:var(--good-soft);color:var(--good)}
.p-flag{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--warn-soft);color:var(--warn)}
.p-muted{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.skill{font-size:11px;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;min-width:0}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
label.f select,label.f input{color:var(--ink);font-weight:500;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.statline{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:14px;align-items:baseline}
.statline h1{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05}
.stat{font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--f-display);font-size:20px;margin-right:3px}

/* court tiles */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.court{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;min-width:0}
.court.s-called{border-color:var(--ball)}
.ct-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex-wrap:wrap}
.ct-no{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.ct-ref{font-size:12px;color:var(--muted);margin-left:auto}
.ct-ref select{font-size:12px;padding:3px 6px}
.ct-what{padding:0 12px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ct-what b{color:var(--ink)}
.surface{position:relative;margin:0 12px;border-radius:6px;background:var(--court-out);padding:8px;min-height:104px}
.lines{position:relative;height:100%;min-height:88px;border:2px solid rgba(255,255,255,.85);border-radius:2px;background:var(--court);display:grid;grid-template-columns:1fr 1fr}
.lines::before,.lines::after{content:"";position:absolute;top:0;bottom:0;width:14%;background:rgba(255,255,255,.09);border:0 solid rgba(255,255,255,.85)}
.lines::before{left:36%;border-left-width:2px}
.lines::after{right:36%;border-right-width:2px}
.net{position:absolute;left:50%;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:#f4f4f0;z-index:1;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.side{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:8px 10px;min-width:0}
.side.b{align-items:flex-end;text-align:right}
.chip{background:rgba(255,255,255,.94);color:#14201b;border-radius:6px;padding:3px 7px;font-weight:600;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ok::after{content:" ✓";color:#2d7a4f;font-weight:800}
.surface.empty .lines{background:repeating-linear-gradient(135deg,var(--court),var(--court) 10px,color-mix(in srgb,var(--court) 85%,#000) 10px,color-mix(in srgb,var(--court) 85%,#000) 20px)}
.surface .msg{grid-column:1/-1;z-index:2;align-self:center;justify-self:center;background:rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:99px}
.ct-foot{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.clock{font-family:var(--f-display);font-size:20px;font-weight:600}
.games{font-family:var(--f-display);font-size:18px;font-weight:600}
.ct-foot .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* layouts */
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.li-main{min-width:0}
.li-t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li-m{font-size:12px;color:var(--muted)}
.tablebox{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.tb{font-size:11px;color:var(--muted)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.divcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.divcard{display:grid;gap:8px}
.divcard h3{font-family:var(--f-display);font-size:22px}
.rules{display:flex;flex-wrap:wrap;gap:4px}
.flags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
details.panel summary{cursor:pointer;font-family:var(--f-display);font-size:20px;font-weight:700;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";float:right;color:var(--muted)}
details.panel[open] summary::after{content:"–"}
details.panel[open] summary{margin-bottom:12px}

/* bracket */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:18px;overflow-x:auto;padding-bottom:6px}
.bround{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bround h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bm{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.bm .lab{font-size:11px;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:6px}
.bm .tm{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;font-size:13px}
.bm .tm+.tm{border-top:1px dashed var(--line)}
.bm .tm.w{font-weight:700}
.bm .tm.tbd{color:var(--muted);font-style:italic}
.bm.live{border-color:var(--accent)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pod{border-radius:var(--r);padding:12px;background:var(--surface-2);border-top:4px solid var(--line)}
.pod .pl{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.pod.g{border-color:var(--gold)}.pod.g .pl{color:var(--gold)}
.pod.s{border-color:var(--silver)}.pod.s .pl{color:var(--silver)}
.pod.b{border-color:var(--bronze)}.pod.b .pl{color:var(--bronze)}

/* phone screens */
.phone-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px;width:100%}
.phone-top{display:flex;align-items:center;gap:8px}
.phone-top b{font-family:var(--f-display);font-size:20px}
.hero{border-radius:14px;padding:16px;display:grid;gap:6px;background:var(--surface-2)}
.hero .big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.hero.h-called{background:var(--ball-soft);color:var(--ball-ink)}
.hero.h-play{background:var(--accent-soft)}
.hero.h-done{background:var(--good-soft)}
.refcourt{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.refcourt h3{font-family:var(--f-display);font-size:24px;display:flex;align-items:center;gap:8px}
.teams2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.scorebox input{width:100%;font-family:var(--f-display);font-size:26px;text-align:center;font-weight:700}
.guide{display:grid;gap:10px}
.guide p{margin:0}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* public */
.pub{display:grid;gap:16px}
.pub-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px}
.pub-head h1{font-family:var(--f-display);font-size:clamp(28px,4vw,44px);font-weight:700;line-height:1}
.pub-clock{margin-left:auto;font-family:var(--f-display);font-size:clamp(26px,4vw,40px);font-weight:600}
.upnext{display:grid;gap:6px}
.un{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.un:first-of-type{border-top:0}
.un .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;width:min(480px,100%);display:grid;gap:14px;max-height:90vh;overflow:auto}
.modal h3{font-family:var(--f-display);font-size:24px}
.gamerow{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center}
.gamerow input{width:100%;font-family:var(--f-display);font-size:22px;text-align:center;font-weight:700}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.picklist{display:grid;gap:4px;max-height:320px;overflow:auto}
.picklist label{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.courttabs{display:flex;gap:6px;flex-wrap:wrap}
.courttabs .tab{border:1px solid var(--line)}
.scorer{display:grid;gap:10px}
.callbar{display:grid;gap:2px;text-align:center;padding:10px;border-radius:12px;background:var(--surface-2)}
.call{font-family:var(--f-display);font-size:58px;font-weight:700;line-height:1;letter-spacing:.02em}
.callsub{font-size:13.5px}
.callsub b{font-weight:700}
.mini{width:100%;height:auto;display:block}
.endlabels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:8px}
.endlabels span{padding:2px 8px;border-radius:99px}
.ta{background:var(--teamA);color:var(--teamA-ink)}
.tbm{background:var(--teamB);color:var(--teamB-ink)}
.rallybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rallybtns .btn{padding:18px 8px;font-size:15px;line-height:1.25;border-width:2px}
.rallybtns .btn small{display:block;font-size:11px;font-weight:600;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.rallybtns .ta{border-color:color-mix(in srgb,var(--teamA-ink) 40%,transparent)}
.rallybtns .tbm{border-color:color-mix(in srgb,var(--teamB-ink) 40%,transparent)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tools .btn{padding:8px 4px;font-size:12.5px}
.banner{border-radius:10px;padding:10px 12px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.banner .btn{margin-left:auto}
.b-switch{background:var(--ball-soft);color:var(--ball-ink)}
.b-to{background:var(--warn-soft);color:var(--warn)}
.b-over{background:var(--good-soft);color:var(--good)}
.b-point{background:var(--bad-soft);color:var(--bad)}
.setup{display:grid;gap:8px}
.setup .eyebrow{min-width:100%}
.timerbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.timerbar .clock{font-size:32px}
.timerbar .btn:first-of-type{margin-left:auto}
.timerbar.up{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.infoline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.rules-card summary{cursor:pointer;font-weight:700;font-size:13px}
.rules-card ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:12.5px}
@media (max-width:1000px){.two,.phone-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.courts,.pools{grid-template-columns:minmax(0,1fr)}.top .tabs{margin-left:0}.podium{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-property:color,background-color,border-color,opacity!important;transition-duration:.12s!important}}

/* ---- open play (scoped) ---- */
.m-op /* Layout: top bar with four views (Venue TV,.m-op Player phone,.m-op Admin,.m-op Match log); courts drawn as mini pickleball courts with net + kitchen bands */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#15201c; --muted:#5a6a63; --line:#d6dfda;
  --accent:#1d5a86; --accent-ink:#ffffff; --accent-soft:#dde9f2;
  --ball:#e3c726; --ball-soft:#fbf3c8; --ball-ink:#4a3f00;
  --court:#2f6f9a; --court-out:#3f7d5f; --good:#256b44; --good-soft:#dcefe3; --warn:#9c4614; --warn-soft:#f8e3d6; --bad:#b3261e; --bad-soft:#f6dcda;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
.m-op .num,.m-op .clock,.m-op td,.m-op .tab{font-variant-numeric:tabular-nums}
.m-op /* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.m-op /* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.m-op .p-free{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.m-op .p-assigned{background:var(--ball-soft);color:var(--ball-ink)}
.m-op .p-play{background:var(--accent-soft);color:var(--accent)}
.m-op .p-blocked{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted)}
.m-op .p-waiting{background:var(--good-soft);color:var(--good)}
.m-op .p-resting{background:var(--warn-soft);color:var(--warn)}
.m-op .p-playing{background:var(--accent-soft);color:var(--accent)}
.m-op .p-left{background:var(--surface-2);color:var(--muted)}
.m-op .p-over{background:var(--bad-soft);color:var(--bad)}
.m-op /* court tile */
.court{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;min-width:0}
.m-op .ct-head{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.m-op .ct-lvl{font-size:11.5px;color:var(--muted);margin-left:auto}
.m-op .surface{position:relative;margin:0 12px;border-radius:6px;background:var(--court-out);padding:8px;min-height:112px}
.m-op .surface .lines{position:relative;height:100%;min-height:96px;border:2px solid rgba(255,255,255,.85);border-radius:2px;background:var(--court);display:grid;grid-template-columns:1fr 1fr}
.m-op .surface .lines::before,.m-op .surface .lines::after{content:"";position:absolute;top:0;bottom:0;width:14%;background:rgba(255,255,255,.09);border:0 solid rgba(255,255,255,.85)}
.m-op .surface .lines::before{left:36%;border-right-width:0;border-left-width:2px}
.m-op .surface .lines::after{right:36%;border-left-width:0;border-right-width:2px}
.m-op .chip{background:rgba(255,255,255,.94);color:#14201b;border-radius:6px;padding:3px 7px;font-weight:600;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;gap:5px;align-items:baseline}
.m-op .chip .sk{font-size:10.5px;color:#5a6a63;font-weight:700}
.m-op .chip.wait{background:rgba(255,255,255,.65)}
.m-op .chip.pend::after{content:"…";color:#8a7a00;font-weight:800}
.m-op .court.s-assigned{border-color:var(--ball)}
.m-op .court.s-blocked .surface{opacity:.45}
.m-op /* admin */
.admin{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.m-op .courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.m-op .qlist{list-style:none;margin:0;padding:0;display:grid}
.m-op .qlist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.m-op .qlist li:first-child{border-top:0}
.m-op .qpos{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.m-op .qlist li.next .qpos{color:var(--ball-ink);background:var(--ball-soft);border-radius:6px}
.m-op .qname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-op .qmeta{font-size:12px;color:var(--muted)}
.m-op .qacts{display:flex;gap:4px}
.m-op .pairtag{font-size:11px;color:var(--accent);font-weight:700}
.m-op .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-op .settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.m-op .roster{max-height:260px;overflow:auto}
.m-op /* tv */
.tv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px}
.m-op .tv-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px}
.m-op .tv-head h1{font-family:var(--f-display);font-size:clamp(28px,4vw,44px);font-weight:700;line-height:1}
.m-op .tv-clock{margin-left:auto;font-family:var(--f-display);font-size:clamp(28px,4vw,44px);font-weight:600}
.m-op .tv-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.m-op .tv .courts{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.m-op .tv .chip{font-size:15px}
.m-op .tv .surface{min-height:140px}
.m-op .upnext{background:var(--surface-2);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.m-op .upnext h2{font-family:var(--f-display);font-size:24px;font-weight:700}
.m-op .un{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:8px;font-size:16px;font-weight:600}
.m-op .un .qpos{font-size:22px}
.m-op .un.first .qpos{background:var(--ball);color:#2a2400;border-radius:6px}
.m-op .tv-foot{display:flex;flex-wrap:wrap;gap:10px 24px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.m-op .qrbox{display:flex;align-items:center;gap:10px}
.m-op .qrbox canvas{border-radius:4px;background:#fff;padding:4px}
.m-op /* player */
.phone-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
.m-op .hero .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.m-op .hero.h-assigned{background:var(--ball-soft);color:var(--ball-ink)}
.m-op .hero.h-playing{background:var(--accent-soft)}
.m-op .hero.h-resting{background:var(--warn-soft)}
.m-op .hero .sub{font-size:13.5px}
.m-op .teamline{font-size:13.5px}
.m-op .pacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-op .pacts .btn{padding:10px}
.m-op .pacts .full{grid-column:1/-1}
.m-op .mini-table{width:100%;border-collapse:collapse;font-size:13px}
.m-op .mini-table td,.m-op .mini-table th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.m-op .mini-table th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.m-op /* log */
.tablebox{overflow-x:auto}
.m-op table.log{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.m-op table.log th,.m-op table.log td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.m-op table.log th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.m-op .w{font-weight:700}
.m-op .score{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap}
.m-op .loggrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.m-op /* modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.5);display:grid;place-items:center;z-index:20;padding:16px}
.m-op .scorein{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.m-op .scorein input{width:80px;font-family:var(--f-display);font-size:26px;text-align:center;font-weight:700}
@media (max-width:980px){.m-op .admin,.m-op .tv-body,.m-op .loggrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.m-op .tv .courts{grid-template-columns:minmax(0,1fr)}.grid2{grid-template-columns:1fr}.m-op .tabs{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-property:color,background-color,border-color,opacity!important;transition-duration:.12s!important}}

/* ---- site shell ---- */
.evpick{min-width:0;max-width:260px}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roster{max-height:340px;overflow:auto}
.evlist{display:grid;gap:10px}
.evcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;background:var(--surface)}
.evcard.is-cur{border-color:var(--accent)}
.evcard h3{font-family:var(--f-display);font-size:22px}
.seg{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg legend{margin-bottom:6px}
.segopt{display:block;cursor:pointer}
.segopt input{position:absolute;opacity:0;pointer-events:none}
.segopt span{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.segopt small{color:var(--muted);font-size:12px}
.segopt input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.segopt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.newbie summary{cursor:pointer;font-weight:600;color:var(--accent)}
fieldset.pf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
fieldset.pf legend{font-weight:700;font-size:13px;padding:0 4px}
textarea{min-width:0}
@media (max-width:560px){.grid2,.seg{grid-template-columns:1fr}.evpick{max-width:100%;flex:1}}


/* ===================== v2: dashboard layout, larger type, scoreboard courts ===================== */
/* type + controls: 16px base, 44px touch targets */
body{font-size:16px;line-height:1.5}
.wrap,.top-in{max-width:1440px}
.brand b{font-size:26px}
.top .tabs .tab{font-size:15px;padding:9px 14px;min-height:42px}
.btn{font-size:14px;padding:9px 14px;min-height:42px;border-radius:9px;touch-action:manipulation;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn.primary{color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{font-size:13.5px;padding:6px 11px;min-height:36px}
.btn.big{font-size:16px;padding:14px;min-height:50px}
select,input[type=text],input[type=number],input[type=password],input[type=search],textarea{font-size:16px;padding:9px 10px;min-height:44px;border-radius:9px}
input[type=time]{font:inherit;font-size:16px;padding:9px 10px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
label.f{font-size:13.5px;gap:6px}
.check{font-size:14.5px}
.panel{padding:18px;border-radius:12px}
.panel h2{font-size:23px;margin-bottom:12px}
.panel h2 small{font-size:13px}
.eyebrow{font-size:12px}
.pill{font-size:12.5px;padding:3px 10px}
.p-live-dot{background:var(--good-soft);color:var(--good)}
.p-live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:2px}
.li-t{font-size:16px}
.li-m,.tb{font-size:13.5px}
.list li{padding:11px 0}
table.t{font-size:15px}
table.t th{font-size:12px}
table.t th,table.t td{padding:9px 10px}
.skill{font-size:12.5px}
.demo-note{font-size:13.5px}
.guide{font-size:15px}
.err{font-size:14px}
.toast{font-size:14.5px;padding:11px 16px}
.modal{padding:22px;gap:14px}
.modal h3{font-size:26px}

/* dashboard frame */
.dash{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.dash-main{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:calc(100vh - 96px);overflow:auto}
.side-nav{display:grid;gap:14px}
.side-group{display:grid;gap:2px;grid-template-columns:minmax(0,1fr)}
.side-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 10px}
.side-item{display:flex;align-items:center;gap:9px;width:100%;min-width:0;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink);min-height:42px;cursor:pointer;font-family:inherit}
.side-item:hover{background:var(--surface-2)}
.side-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-item.ev.is-open{background:var(--surface-2)}
.side-item.sub{padding-left:30px;font-weight:600;font-size:14.5px;min-height:40px}
.side-item .badge{margin-left:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.side-item .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ev-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-sm{display:none}
.lbl-sm{display:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.op{background:var(--good)}
.dot.t{background:var(--accent)}
.dot.live{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}

/* page header + KPI tiles */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:16px}
.ph-t{display:grid;gap:2px;min-width:0}
.page-head h1{font-family:var(--f-display);font-size:clamp(30px,3.2vw,40px);font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.page-actions select{min-width:0;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:3px;align-content:start;min-width:0}
.k-label{font-size:13.5px;font-weight:600;color:var(--muted)}
.k-val{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.05}
.k-sub{font-size:13px;color:var(--muted)}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-soft)}
.kpi.warn .k-val{color:var(--warn)}
.kpi.good .k-val{color:var(--good)}
.kbar{display:block;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.kbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec-h{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0 0 10px}
.statline{gap:8px 12px;margin-bottom:16px;align-items:center}
.statline h1{font-size:clamp(30px,3.2vw,40px);margin-right:8px}
.statline .stat{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}
.evcard{padding:16px;gap:8px}
.evcard h3{font-size:26px}

/* scoreboard court cards */
.courts{gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.ct2{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.ct2.s-play{border-top-color:var(--accent)}
.ct2.s-called,.ct2.s-assigned{border-top-color:var(--ball)}
.ct2.s-hold{border-top-color:var(--warn)}
.ct2.s-blocked{opacity:.72}
.ct2-h{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.ct2-id{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.ct2-no{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1}
.ct2-clock{display:grid;justify-items:end;line-height:1.05;text-align:right}
.ct2-clock .clock{font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.ct2-clock small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ct2-what{font-size:15px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.ct2-board{display:grid;gap:6px}
.ct2-team{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;min-height:66px}
.ct2-team.a{background:var(--teamA);color:var(--teamA-ink)}
.ct2-team.b{background:var(--teamB);color:var(--teamB-ink)}
.ct2-names{display:grid;gap:2px;min-width:0;flex:1}
.ct2-names .nm{font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.ct2-names .nm small{font-weight:600;opacity:.75;font-size:13px}
.ct2-names .nm.tbd{opacity:.6;font-style:italic}
.here-tag{white-space:nowrap;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(0,0,0,.1);vertical-align:2px}
.here-tag.ok{background:var(--good);color:#fff}
.ct2-score{font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1;min-width:1.3ch;text-align:right}
.ct2-here{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.1);white-space:nowrap}
.ct2-here.ok{background:var(--good);color:#fff}
.srv-ball{width:15px;height:15px;border-radius:50%;background:#e6cd3a;border:2px solid rgba(0,0,0,.4);flex:none}
.ct2-empty{display:grid;gap:4px;padding:18px 12px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);text-align:center;min-height:138px;align-content:center}
.ct2-empty-t{font-size:18px;font-weight:700;color:var(--muted)}
.ct2-next{font-size:14.5px;overflow-wrap:anywhere}
.ct2-meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.ct2-lvl{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ct2-lvl select{min-height:36px;padding:4px 8px;font-size:14px;max-width:190px}
.ct2-acts{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px;border-top:1px solid var(--line);padding-top:10px}
/* big: venue TV + public display */
.courts.big{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}
.ct2.big{padding:18px;border-top-width:8px}
.ct2.big .ct2-no{font-size:clamp(34px,3vw,46px)}
.ct2.big .ct2-clock .clock{font-size:clamp(30px,2.6vw,40px)}
.ct2.big .ct2-what{font-size:clamp(16px,1.3vw,20px)}
.ct2.big .ct2-team{min-height:90px;padding:12px 16px}
.ct2.big .ct2-names .nm{font-size:clamp(21px,1.9vw,28px)}
.ct2.big .ct2-score{font-size:clamp(56px,5vw,80px)}
.ct2.big .ct2-here{font-size:15px}
.ct2.big .srv-ball{width:22px;height:22px}
.ct2.big .ct2-empty{min-height:200px}
.ct2.big .ct2-empty-t{font-size:clamp(21px,1.8vw,26px)}
.ct2.big .ct2-next{font-size:clamp(16px,1.3vw,19px)}
.ct2.big .ct2-meta{font-size:clamp(14px,1.1vw,17px)}
.pub-two{grid-template-columns:minmax(0,1fr) 380px}
.pub .upnext .un,.pub .li-t{font-size:17px}
.pub .li-m{font-size:14.5px}
.pub-head h1{font-size:clamp(32px,4vw,52px)}
.m-op .tv-head h1{font-size:clamp(32px,4vw,52px)}
.m-op .upnext h2{font-size:28px}
.m-op .un{font-size:21px}
.m-op .un .qpos{font-size:24px}
.m-op .tv-foot{font-size:15px}
.m-op .qname{font-size:16px;white-space:normal;overflow:visible}
.m-op .qlist li{grid-template-columns:34px minmax(0,1fr);row-gap:6px}
.m-op .qlist li .qacts{grid-column:2;flex-wrap:wrap}
.m-op .qmeta{font-size:13.5px}
.m-op .qpos{font-size:22px}
.m-op .admin{grid-template-columns:minmax(0,1fr) 400px}
/* player + referee phones */
.phone{font-size:16px;grid-template-columns:minmax(0,1fr)}
.phone>*,.refcourt>*,.scorer>*{min-width:0}
.refcourt,.scorer{grid-template-columns:minmax(0,1fr)}
.rallybtns,.teams2,.scorebox{grid-template-columns:repeat(2,minmax(0,1fr))}
.rallybtns .btn{overflow-wrap:anywhere}
.hero .big{font-size:44px}
.rallybtns .btn{font-size:16px}

@media (max-width:1180px){.m-op .admin,.pub-two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:920px){
  .dash{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;max-height:none;padding:6px;overflow-x:auto;overflow-y:hidden}
  .side-nav{display:flex;gap:6px;width:max-content}
  .side-group{display:contents}
  .side-h,.side-item.ev-other{display:none}
  .side-item{width:auto;white-space:nowrap;flex:none;min-height:40px;padding:8px 12px}
  .side-item.sub{padding-left:12px}
  .side-item.ev.is-open{background:none;padding-right:4px}
  .side-item.ev.is-open .ev-n{max-width:160px}
  .back-sm{display:flex}
  .side.has-ev .side-group.ws{display:none}
}
@media (max-width:560px){
  .top .tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;margin-left:0}
  .top .tabs .tab{flex:none;padding:8px 11px}
  .lbl-lg{display:none}
  .lbl-sm{display:inline}
  .evpick{flex:1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:12px}
  .k-val{font-size:32px}
  .page-actions{margin-left:0;width:100%}
  .ct2-score{font-size:40px}
}


/* ===================== v3: polish (elevation, icons, press feedback, upcoming games) ===================== */
:root{--shadow-1:0 1px 2px rgba(20,32,28,.06),0 2px 8px rgba(20,32,28,.05);--shadow-2:0 6px 18px rgba(20,32,28,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 8px 22px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 8px 22px rgba(0,0,0,.5)}
.top{box-shadow:var(--shadow-1)}
.panel,.kpi,.ct2,.side,.evcard,.phone{box-shadow:var(--shadow-1)}
.evcard{transition:box-shadow .15s ease-out,border-color .15s ease-out}
.evcard:hover{box-shadow:var(--shadow-2)}
.brand{align-items:center}
.logo{width:28px;height:28px;flex:none}
/* icons */
.ico{width:19px;height:19px;flex:none;opacity:.85}
.side-item[aria-current="page"] .ico{opacity:1}
.side-item.sub{padding-left:22px}
/* press + hover feedback */
.btn{transition:background-color .12s ease-out,border-color .12s ease-out,transform .08s ease-out}
.btn:not([disabled]):active{transform:translateY(1px) scale(.99)}
.btn.primary:not([disabled]):hover{background:color-mix(in srgb,var(--accent) 86%,var(--ink));border-color:color-mix(in srgb,var(--accent) 86%,var(--ink))}
.btn[disabled]{cursor:not-allowed}
.side-item{transition:background-color .12s ease-out}
.side-item:active{background:var(--accent-soft)}
.top .tabs .tab{transition:background-color .12s ease-out,color .12s ease-out}
@media (pointer:coarse){.btn.sm{min-height:44px}.side-item{min-height:44px}}
.ct2-acts{gap:8px}
#app h1:focus{outline:none}
.req{color:var(--bad);font-weight:700}
/* live dot pulse (transform + opacity only) */
.dot{position:relative}
.dot.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--good);animation:livepulse 2s ease-out infinite}
@keyframes livepulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.dot.live::after{animation:none;display:none}.btn:active{transform:none}}
/* upcoming games */
.upc{list-style:none;margin:0;padding:0;display:grid}
.upc-i{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.upc-i:first-child{border-top:0;padding-top:2px}
.upc-n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.upc-i.ready .upc-n{background:var(--ball);color:#2a2400;border-color:transparent}
.upc-b{min-width:0}
.upc-b .li-t{overflow-wrap:anywhere}
.upc-b{display:grid;gap:3px;justify-items:start}
.upc-i .pill{white-space:normal;margin-top:3px}
.upc-a{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.pub .upc .li-t{font-size:18px}
.pub .upc .li-m{font-size:14.5px}
.pub .upc-n{width:36px;height:36px;font-size:21px}


/* ===================== v4: schedule ===================== */
.assist{display:grid;gap:8px;margin:0 0 18px}
.assist-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:var(--shadow-1)}
.assist-i.late,.assist-i.behind{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.assist-i.soon{background:var(--ball-soft);border-color:color-mix(in srgb,var(--ball) 50%,transparent)}
.assist-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.assist-i.late .assist-dot,.assist-i.behind .assist-dot{background:var(--warn)}
.assist-i.soon .assist-dot{background:var(--ball)}
.assist-m{font-size:15px;min-width:0}
.assist-a{display:flex;gap:8px;flex-wrap:wrap}
.daytabs{margin:0 0 12px}
/* timeline */
.tl{display:grid;gap:6px}
.tl-row{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr);gap:12px;align-items:center}
.tl-l{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tl-track{position:relative;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.tl-head .tl-track{background:none;border:0;height:20px}
.tl-tick{position:absolute;top:0;transform:translateX(-50%);font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tl-bar{position:absolute;top:4px;bottom:4px;border-radius:6px;font-size:12px;font-weight:700;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:var(--accent-ink);background:var(--accent);font-variant-numeric:tabular-nums}
.tl-bar.s-plan{background:color-mix(in srgb,var(--accent) 55%,var(--surface));color:var(--ink)}
.tl-bar.s-playing{background:var(--accent);color:var(--accent-ink)}
.tl-bar.s-done{background:var(--good);opacity:.75}
.tl-bar.s-hold{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.tl-ghost{position:absolute;top:1px;bottom:1px;border:2px dashed var(--muted);border-radius:7px;opacity:.6}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);border-radius:2px}
.tl-end{position:absolute;top:0;bottom:0;width:0;border-left:2px dotted var(--muted)}
.tl-none{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.tl-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.tl-key i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.k-plan{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}.k-playing{background:var(--accent)}.k-done{background:var(--good);opacity:.75}
.k-ghost{border:2px dashed var(--muted)}.k-now{background:var(--bad);width:3px!important}.k-end{border-left:2px dotted var(--muted);width:3px!important;border-radius:0!important}
/* play order */
.blks{list-style:none;margin:0;padding:0;display:grid}
.blk{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.blk:first-child{border-top:0;padding-top:4px}
.blk-n{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--surface-2);border:1px solid var(--line)}
.blk-main{display:grid;gap:4px;min-width:0}
.blk-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.blk-time{font-size:14.5px}
.blk-ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-top:6px}
.blk-ctrl label.f{min-width:150px}
.blk-courts{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.blk-courts legend{font-size:13.5px;color:var(--muted);font-weight:600;padding:0;margin-bottom:6px;width:100%}
.cchip{position:relative;cursor:pointer}
.cchip input{position:absolute;opacity:0;pointer-events:none}

const App=(()=>{
  const KEY='paddle-stack-demo-v1';
  const DEMO=true;
  const tools=()=>DEMO||!!db.tools;
  let db,view='admin',home=true,homeSec='events',modal=null,lastKey='',pendingTop=false;
  let lb={period:'all',sort:'rating',min:5,skill:'all'};
  document.addEventListener('click',e=>{if(e.target.closest('.side-item,.top .tab'))pendingTop=true},true);
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fresh=()=>({events:[],players:[],officials:[],cur:null,n:0});
  function load(){try{const r=localStorage.getItem(KEY);if(r){db=JSON.parse(r);tagPlayers();return}}catch(e){}db=fresh()}
  function tagPlayers(){db.players.forEach(p=>{if(p.club||p.tmp)return;
    const op=db.events.some(ev=>ev.type==='openplay'&&((ev.checkins&&ev.checkins[p.id])||(ev.matches||[]).some(m=>[...(m.a||[]),...(m.b||[])].includes(p.id))));
    const t=db.events.find(ev=>ev.type==='tournament'&&(ev.entries||[]).some(e=>(e.p||[]).includes(p.id)));
    if(op||!t)p.club=true;else p.tmp=t.id})}
  function dropTemp(){const used=new Set();db.events.forEach(ev=>{if(ev.type==='tournament')(ev.entries||[]).forEach(e=>(e.p||[]).forEach(x=>used.add(x)))});
    const n=db.players.length;db.players=db.players.filter(p=>p.club||!p.tmp||used.has(p.id));
    db.players.forEach(p=>{if(!p.club&&p.tmp&&!db.events.some(e=>e.id===p.tmp)){const t=db.events.find(ev=>ev.type==='tournament'&&(ev.entries||[]).some(e=>(e.p||[]).includes(p.id)));if(t)p.tmp=t.id}});
    return n-db.players.length}
  function save(quiet){try{localStorage.setItem(KEY,JSON.stringify(db,function(k,v){if((k==='players'||k==='officials')&&this!==db)return undefined;return v}))}catch(e){}if(!quiet&&typeof CL!=='undefined'&&CL.on)schedulePush()}
  const uid=p=>p+'_'+(++db.n).toString(36)+Math.random().toString(36).slice(2,6);
  const cur=()=>db.events.find(e=>e.id===db.cur)||null;
  const mod=ev=>ev.type==='openplay'?OPM:TM;
  function newPin(){let p;do{p=String(Math.floor(100000+Math.random()*900000))}while(db.players.some(x=>x.pin===p));return p}
  function ensureSkill(p){if(p&&p.skill==null)p.skill=p.self??(p.d?Math.round(p.d*2)/2:(p.s?Math.round(p.s*2)/2:3))}
  function addPlayer(o){const p={id:uid('p'),...o};ensureSkill(p);db.players.push(p);return p.id}
  function isActive(type){const ev=cur();return!!ev&&ev.type===type&&!(view==='admin'&&home)}
  function toast(t){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}

  /* ---------- cloud sync (Supabase) ----------
     Docs: 'club' = players + staff (no PINs); 'ev:<id>' = one event. PINs live server-side in np_secrets.
     Every save pushes changed docs with the rev this device last saw; a conflict pulls the newer copy,
     merges it with this device's edits (by id, field by field) and pushes again. */
  const CFG=(window.NP_CLOUD&&window.supabase&&window.supabase.createClient)?window.NP_CLOUD:null,CLOUD_WANTED=!!window.NP_CLOUD;
  const BUILD='2026-10-28a';
  const CL={on:!!CFG,sb:null,base:{},revs:{},tok:{staff:null,player:null},staffRole:null,pins:null,ready:false,live:false,offline:false,busy:false,again:false,dirty:false,fail:0,pushT:null,pullQ:new Set(),pullT:null,rT:null,pollT:null,warned:0};
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const stable=v=>JSON.stringify(v,(k,x)=>isObj(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const keyOf=o=>isObj(o)?(o.id!=null?'i'+o.id:o.no!=null?'n'+o.no:null):null;
  const keyedArr=a=>Array.isArray(a)&&a.every(x=>keyOf(x)!=null);
  const dbg=(...a)=>{if(window.NP_DEBUG)console.log('[sync '+(window.NP_DEBUG)+']',...a)};
  const cloudRole=()=>CL.tok.staff?CL.staffRole:CL.tok.player?'player':null;
  function evDoc(ev){return JSON.parse(JSON.stringify(ev,function(k,v){return this===ev&&(k==='players'||k==='officials')?undefined:v}))}
  const noPin=a=>(a||[]).map(x=>{const r={...x};delete r.pin;return r});
  function docOf(id){
    if(id==='club')return{players:noPin(db.players),officials:noPin(db.officials),...(db.settings&&Object.keys(db.settings).length?{settings:clone(db.settings)}:{})};

  /* ---------- club leaderboard: open play only, never tournaments ----------
     Club rating: starts at 1000. After each game, both players on a side move by
     K x (result - expected), where expected comes from the two sides' average ratings.
     K is 32 for a player's first 10 games (provisional), then 20; wins by a wide margin
     count up to 1.5x. Ratings always use every open play game; the period filters only
     change which games count for the stats and the rating change shown. */
  function opGames(){
    const out=[];db.events.forEach(ev=>{if(ev.type!=='openplay')return;(ev.matches||[]).forEach(m=>{if(m.status==='done'&&m.sa!=null&&m.sb!=null&&m.sa!==m.sb)out.push({ev:ev.id,t:m.end||0,a:m.a,b:m.b,sa:m.sa,sb:m.sb})})});
    return out.sort((x,y)=>x.t-y.t);
  }
  function clubBoard(o){
    o=o||{};const R={},N={},st=new Map(),sessions=new Set();
    const rec=id=>{if(!st.has(id))st.set(id,{id,g:0,w:0,pf:0,pa:0,streak:0,best:0,last:0,r0:null,r1:null});return st.get(id)};
    const rt=id=>R[id]??1000;
    for(const m of opGames()){
      const inP=(!o.from||m.t>=o.from)&&(!o.ev||m.ev===o.ev),all=[...m.a,...m.b];
      if(inP){all.forEach(id=>{const r=rec(id);if(r.r0==null)r.r0=rt(id)});sessions.add(m.ev)}
      const ra=m.a.reduce((x,id)=>x+rt(id),0)/m.a.length,rb=m.b.reduce((x,id)=>x+rt(id),0)/m.b.length;
      const ea=1/(1+Math.pow(10,(rb-ra)/400)),aw=m.sa>m.sb?1:0,mult=1+Math.min(Math.abs(m.sa-m.sb),11)/22;
      m.a.forEach(id=>{const k=(N[id]||0)<10?32:20;R[id]=rt(id)+k*mult*(aw-ea);N[id]=(N[id]||0)+1});
      m.b.forEach(id=>{const k=(N[id]||0)<10?32:20;R[id]=rt(id)+k*mult*((1-aw)-(1-ea));N[id]=(N[id]||0)+1});
      if(inP)[['a',m.sa,m.sb,aw],['b',m.sb,m.sa,1-aw]].forEach(([sd,f,ag,won])=>m[sd].forEach(id=>{const r=rec(id);r.g++;r.w+=won;r.pf+=f;r.pa+=ag;r.last=m.t;r.streak=won?(r.streak>0?r.streak+1:1):(r.streak<0?r.streak-1:-1);r.best=Math.max(r.best,r.streak);r.r1=rt(id)}));
    }
    const rows=[...st.values()].map(r=>{const p=db.players.find(x=>x.id===r.id)||{name:'Unknown player'};ensureSkill(p);
      return{...r,name:p.name,skill:p.skill,rating:Math.round(rt(r.id)),dr:Math.round((r.r1??rt(r.id))-(r.r0??1000)),wp:r.g?r.w/r.g:0,diff:r.pf-r.pa,prov:(N[r.id]||0)<10,total:N[r.id]||0}});
    return{rows,games:opGames().filter(m=>(!o.from||m.t>=o.from)&&(!o.ev||m.ev===o.ev)).length,sessions:sessions.size};
  }
  const SORTS={rating:(a,b)=>b.rating-a.rating||b.wp-a.wp,wins:(a,b)=>b.w-a.w||b.wp-a.wp,wp:(a,b)=>b.wp-a.wp||b.w-a.w,diff:(a,b)=>b.diff-a.diff||b.w-a.w,games:(a,b)=>b.g-a.g||b.w-a.w};
  function rankRows(rows,sort,min){const r=rows.filter(x=>x.g>=min).sort(SORTS[sort]||SORTS.rating);r.forEach((x,i)=>x.rank=i+1);return r}
  function playerRank(pid){const b=clubBoard({}),r=rankRows(b.rows,'rating',5),me=b.rows.find(x=>x.id===pid);return me?{...me,rank:(r.find(x=>x.id===pid)||{}).rank||null,of:r.length}:null}
  function sessionLeaders(evId,n){return clubBoard({ev:evId}).rows.sort((a,b)=>b.w-a.w||b.diff-a.diff||b.g-a.g).slice(0,n)}
  const fmtDay=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric'}):'—';
  const pct=x=>Math.round(x*100)+'%';
  const sgn=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'0';

  function homeBoard(){

    const topStreak=[...pool].sort((a,c)=>c.best-a.best)[0];

     ${pod.length?`<div class="podium lb-pod">${pod.map((r,i)=>`<div class="pod ${k[i]}"><div class="pl">${place[i]}</div><div class="lb-pn">${esc(r.name)}</div><div class="li-m">${sortLabel}: <b>${metric(r)}</b> · ${r.w}–${r.g-r.w}</div></div>`).join('')}</div>`:''}
     <section class="panel"><h2>Rankings <small>${sortLabel}</small></h2>
      ${ranked.length?`<div class="tablebox"><table class="t lb-t"><thead><tr><th class="n">#</th><th>Player</th><th class="n">Rating</th><th class="n">Games</th><th class="n">W–L</th><th class="n">Win rate</th><th class="n">+/–</th><th>Streak</th><th>Last played</th></tr></thead><tbody id="lbRows">

        <td class="n num"><b>${r.rating}</b>${r.dr?` <span class="lb-d ${r.dr>0?'up':'down'}">${sgn(r.dr)}</span>`:''}</td><td class="n num">${r.g}</td><td class="n num">${r.w}–${r.g-r.w}</td><td class="n num">${pct(r.wp)}</td><td class="n num">${sgn(r.diff)}</td>

       :`<p class="muted" style="margin:0">Nobody has ${lb.min} game${lb.min===1?'':'s'} in this period yet. Lower the minimum or pick a longer period.</p>`}

     <section class="panel guide" style="margin-top:16px"><h2>How rankings work</h2><ol>

const OPM=(()=>{

let S, view='admin', me=null, modal=null, opSub='live';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+S.offset;
const PL=id=>S.players.find(p=>p.id===id);
const C=id=>S.checkins[id];
const M=id=>S.matches.find(m=>m.id===id);
const CT=no=>S.courts.find(c=>c.no===+no);
const short=id=>{const n=PL(id).name.split(' ');return n[0]+(n[1]?' '+n[1][0]+'.':'')};
const fmt=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+':'+String(s).padStart(2,'0')};
const mins=ms=>Math.max(0,Math.round(ms/60000));
const clockStr=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const sum=t=>t.reduce((a,id)=>a+PL(id).skill,0);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LEVELS={all:'All levels',low:'3.5 and below',high:'4.0 and up'};
const fits=(id,lvl)=>{const s=PL(id).skill;return lvl==='all'||(lvl==='low'?s<=3.5:s>=4)};
function save(){App.save()}
function toast(t){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ---------- queue engine ---------- */
const waitingIds=()=>Object.keys(S.checkins).filter(id=>C(id).status==='waiting');
const ukey=u=>{const b=u.map(i=>C(i).bump).filter(Boolean);if(b.length)return[-1,Math.min(...b)];return[Math.max(...u.map(i=>C(i).games)),Math.max(...u.map(i=>C(i).since))]};
const cmpU=(a,b)=>{const x=ukey(a),y=ukey(b);return x[0]-y[0]||x[1]-y[1]};

// units ready to be called (singles + pairs whose partner is also waiting)
function units(lvl='all',exclude=new Set()){
  const seen=new Set(),out=[];
  for(const id of waitingIds()){
    if(seen.has(id)||exclude.has(id)||!fits(id,lvl))continue;
    const p=C(id).pairWith;
    if(p){const pc=C(p);
      if(pc&&pc.status==='waiting'&&!exclude.has(p)&&fits(p,lvl)){seen.add(id);seen.add(p);out.push([id,p])}
      continue}
    seen.add(id);out.push([id]);
  }
  return out.sort(cmpU);
}
// display order of everyone waiting, with players held for a busy partner at the end
function queueOrder(){
  const us=units('all'),inU=new Set(us.flat());
  const held=waitingIds().filter(id=>!inU.has(id)).sort((a,b)=>C(a).since-C(b).since).map(id=>({ids:[id],held:true}));
  return us.map(u=>({ids:u,held:false})).concat(held);
}
function pick(lvl,n,exclude){
  const sel=[];let c=0;
  for(const u of units(lvl,exclude)){if(c+u.length<=n){sel.push(u);c+=u.length}if(c===n)break}
  return c===n?sel:null;
}
const rep=t=>(C(t[0]).lastPartner===t[1]||C(t[1]).lastPartner===t[0])?2:0;
function makeTeams(us){
  const pairs=us.filter(u=>u.length===2),singles=us.filter(u=>u.length===1).map(u=>u[0]);
  if(pairs.length===2)return[pairs[0],pairs[1]];
  if(pairs.length===1)return[pairs[0],singles];
  const p=[...singles];
  if(S.session.teams==='random')shuffle(p);else p.sort((a,b)=>PL(b).skill-PL(a).skill);
  const opts=[[[p[0],p[3]],[p[1],p[2]]],[[p[0],p[2]],[p[1],p[3]]],[[p[0],p[1]],[p[2],p[3]]]];
  let best=opts[0],bs=1e9;
  opts.forEach((o,i)=>{let sc=S.session.teams==='balanced'?Math.abs(sum(o[0])-sum(o[1])):i*.01;sc+=rep(o[0])+rep(o[1]);if(sc<bs){bs=sc;best=o}});
  return best;
}
function createMatch(ct,teams,manual){
  const m={id:'m'+(++S.seq),court:ct.no,a:teams[0],b:teams[1],status:'assigned',assignedAt:now(),confirmed:{},start:null,end:null,sa:null,sb:null,manual:!!manual};
  S.matches.push(m);ct.match=m.id;ct.state='assigned';
  [...m.a,...m.b].forEach(id=>{const c=C(id);c.status='playing';c.bump=null;c.restAfter=false});
  return m;
}
// admin override: put any player who isn't on a court into a called or live game
function swap(ct,outId,inId,outTo){
  const m=M(ct.match);
  [m.a,m.b].forEach(t=>{const k=t.indexOf(outId);if(k>-1)t[k]=inId});
  delete m.confirmed[outId];m.confirmed[inId]=true;m.manual=true;
  const o=C(outId);if(o.pairWith&&o.pairWith!==inId)unpair(outId);
  o.status=outTo==='break'?'resting':outTo==='left'?'left':'waiting';
  if(outTo==='front')o.bump=now();
  const n=C(inId);n.status='playing';n.bump=null;n.restAfter=false;n.leaveAfter=false;
  if(m.status==='assigned'&&[...m.a,...m.b].every(p=>m.confirmed[p]))startMatch(ct);
}
function bump(id){const c=C(id);if(c.status==='resting')c.status='waiting';c.bump=now()}
function assign(ct){const us=pick(ct.level,4);if(!us)return false;createMatch(ct,makeTeams(us));return true}

  if(!S.session.open||!S.session.autoFill)return false;

}
function startMatch(ct){const m=M(ct.match);m.status='play';m.start=now();ct.state='play'}
function confirm(id){
  const m=S.matches.find(x=>x.status==='assigned'&&[...x.a,...x.b].includes(id));if(!m)return;

function backToQueue(id){const c=C(id);
  if(c.leaveAfter){c.status='left';unpair(id)}else if(c.restAfter)c.status='resting';else c.status='waiting';
  c.leaveAfter=false;c.restAfter=false}
function finish(ct,sa,sb){
  const m=M(ct.match);m.sa=sa;m.sb=sb;m.end=now();m.status='done';
  const aWin=sa>sb,W=aWin?m.a:m.b,L=aWin?m.b:m.a,all=[...m.a,...m.b];
  all.forEach(id=>{const c=C(id);c.games++;c.since=now();c.lastPartner=(m.a.includes(id)?m.a:m.b).find(x=>x!==id)});
  W.forEach(id=>C(id).wins++);
  ct.match=null;ct.state='free';
  L.forEach(id=>{C(id).streak=0;backToQueue(id)});
  let stay=false;
  if(S.session.rule==='winners'&&S.session.open&&!W.some(id=>C(id).leaveAfter||C(id).restAfter)){
    const st=(C(W[0]).streak||0)+1;
    if(st<2){const us=pick(ct.level,2,new Set(all));
      if(us){W.forEach(id=>C(id).streak=st);const nm=createMatch(ct,[W,us.flat()]);W.forEach(id=>nm.confirmed[id]=true);stay=true}}
  }
  if(!stay)W.forEach(id=>{C(id).streak=0;backToQueue(id)});
  return {W,stay};
}
function cancel(ct){
  const m=M(ct.match);m.status='void';m.end=now();
  [...m.a,...m.b].forEach(id=>backToQueue(id));

function replaceNoShows(ct){

  const subs=units(ct.level,new Set(all)).filter(u=>u.length===1).map(u=>u[0]);
  if(subs.length<missing.length)return 'Not enough players waiting to replace '+missing.length+' no-show'+(missing.length>1?'s':'')+'.';
  missing.forEach((id,i)=>{const r=subs[i];
    [m.a,m.b].forEach(t=>{const k=t.indexOf(id);if(k>-1)t[k]=r});
    const c=C(id);c.status='resting';if(c.pairWith)unpair(id);
    C(r).status='playing'});

}

function positionOf(id){const q=queueOrder();let pos=0;for(const u of q){if(u.ids.includes(id))return{pos,held:u.held};pos+=u.ids.length}return null}
