function counts(){const v=Object.values(S.checkins);return{here:v.filter(c=>c.status!=='left').length,waiting:v.filter(c=>c.status==='waiting').length,playing:v.filter(c=>c.status==='playing').length,resting:v.filter(c=>c.status==='resting').length,games:S.matches.filter(m=>m.status==='done').length}}

function renderTV(){
  const q=queueOrder();let pos=0;const rows=[];
  for(const u of q){if(u.held)continue;for(const id of u.ids){if(pos<10)rows.push(`<div class="un ${pos<4?'first':''}"><span class="qpos">${pos+1}</span><span>${esc(short(id))}${u.ids.length===2?' <span class="pairtag">pair</span>':''}</span></div>`);pos++}}
  const k=counts();
  const head=`<div class="tv-head"><img class="pub-logo" src="${LOGO_LOCK}" alt="Next Point Pickleball"><div><div class="eyebrow">${esc(S.session.venue)}</div><h1>${esc(S.session.name)}</h1></div><div class="tv-clock" id="tvClock">${clockStr(now())}</div>${App.qrBlock('Scan to check in')}</div>`;
  if(App.kioskPage()==='board')return tvBoard(head);
  return `<section class="tv">
    ${head}
    <div class="tv-body"><div class="courts big">${S.courts.map(c=>courtTile(c,'tv')).join('')}</div>
    <aside class="upnext"><h2>Up next</h2>${rows.join('')||'<span class="muted">Nobody waiting. Check in to play.</span>'}
    ${pos>10?`<span class="muted">+ ${pos-10} more in line</span>`:''}
    ${(()=>{const L=App.sessionLeaders(S.id,5);return L.length?`<h2 class="tl-lead">Tonight's leaders</h2><ol class="lead-l">${L.map((r,i)=>`<li><span class="qpos">${i+1}</span><span class="lead-n">${esc(short(r.id))}</span><span class="lead-s num">${r.w}–${r.g-r.w}</span></li>`).join('')}</ol>`:''})()}</aside></div>
    <div class="tv-foot">
    <span><b class="num">${k.here}</b> players here</span><span><b class="num">${k.games}</b> games played</span><span>${k.waiting?`Next game in about <b class="num">${mins(estWait(0))}</b> min`:'Nobody waiting'}</span>
    <span>${S.session.rule==='winners'?'Winners stay on (max 2 games)':'Everyone rotates off after each game'}</span></div>
  </section>`;
}

function renderAdmin(){
  const k=counts();
  const q=queueOrder();let pos=0;
  const qrows=q.map(u=>u.ids.map(id=>{const c=C(id),p=PL(id);const li=`<li class="${!u.held&&pos<4?'next':''}"><span class="qpos">${u.held?'–':pos+1}</span>
    <div style="min-width:0"><div class="qname">${esc(p.name)} <span class="skill">${p.skill.toFixed(1)}</span></div>
    <div class="qmeta">${c.games} game${c.games===1?'':'s'} · waiting <span data-since="${c.since}" data-fmt="min">${mins(now()-c.since)}</span> min${c.pairWith?` · <span class="pairtag">with ${esc(short(c.pairWith))}</span>`:''}${u.held?' · held for partner':''}${c.bump?' · <span class="pairtag">sent to front</span>':''}</div></div>
    <div class="qacts">${c.bump?`<button class="btn sm" data-act="unbump" data-id="${id}">Undo front</button>`:`<button class="btn sm" data-act="bump" data-id="${id}" title="Override the queue order">To front</button>`}<button class="btn sm" data-act="rest" data-id="${id}">Break</button><button class="btn sm danger" data-act="leave" data-id="${id}">Leave</button></div></li>`;if(!u.held)pos++;return li}).join('')).join('');
  const resting=Object.keys(S.checkins).filter(id=>C(id).status==='resting');
  const playing=Object.keys(S.checkins).filter(id=>C(id).status==='playing'&&(C(id).restAfter||C(id).leaveAfter));
  const notHere=S.players.filter(p=>(p.club||C(p.id))&&(!C(p.id)||C(p.id).status==='left'));
  const here=Object.keys(S.checkins).filter(id=>C(id).status!=='left').sort((a,b)=>PL(a).name.localeCompare(PL(b).name));
  const opt=ids=>ids.map(id=>`<option value="${id}">${esc(PL(id).name)}</option>`).join('');
  const busyC=S.courts.filter(c=>c.state==='play'||c.state==='assigned').length,useC=S.courts.filter(c=>c.state!=='blocked').length;
  return App.pageHead(['Open play',esc(S.session.venue||''),esc(S.session.date||'')].filter(Boolean).join(' · '),esc(S.session.name),
     `<span class="pill ${S.session.open?'p-waiting':'p-left'}">${S.session.open?'Session open':'Session closed'}</span><button class="btn" data-view="public">Venue display</button>${S.session.open?'<button class="btn" data-act="endModal">End session</button>':'<button class="btn primary" data-act="reopen">Reopen session</button>'}`)+
    `<div class="kpis">${App.kpi('Players here',k.here,'checked in today')}${App.kpi('In line',k.waiting,k.waiting?'next game in ~'+mins(estWait(0))+' min':'nobody waiting')}${App.kpi('Courts in use',busyC+' / '+useC,k.playing+' players on court','',useC?busyC/useC:0)}${App.kpi('On break',k.resting,'keep their place')}${App.kpi('Games played',k.games,k.games?'avg '+mins(avgGame())+' min':'none yet')}</div>
  <div class="admin">
    <div class="stack">
      <h2 class="sec-h">Courts</h2>
      <div class="courts">${S.courts.map(c=>courtTile(c,'admin')).join('')}</div>
      <details class="panel" ${S.ui&&S.ui.settings?'open':''} id="setPanel"><summary>Session settings</summary>
        <div class="settings">
          <label class="f">After each game<select id="setRule"><option value="off" ${S.session.rule==='off'?'selected':''}>Everyone rotates off</option><option value="winners" ${S.session.rule==='winners'?'selected':''}>Winners stay (max 2 games)</option></select></label>
          <label class="f">Teams<select id="setTeams"><option value="balanced" ${S.session.teams==='balanced'?'selected':''}>Balanced by skill</option><option value="random" ${S.session.teams==='random'?'selected':''}>Random</option></select></label>
          <label class="f">Game to<select id="setTo">${[11,15,21].map(n=>`<option ${S.session.gameTo===n?'selected':''}>${n}</option>`).join('')}</select></label>
          <label class="f">No-show timer<select id="setNoShow">${[60,120,180].map(n=>`<option value="${n}" ${S.session.noShow===n?'selected':''}>${n/60} min</option>`).join('')}</select></label>
          <label class="check"><input type="checkbox" id="setAuto" ${S.session.autoFill?'checked':''}> Call players automatically when a court opens</label>
          <div class="row"><span class="muted">Courts: ${S.courts.length}</span><button class="btn sm" data-act="addCourt">Add court</button><button class="btn sm" data-act="removeCourt">Remove last</button></div>
        </div>
        <p class="muted" style="margin:12px 0 0">Overrides: <b>To front</b> on anyone in line, <b>Swap player</b> or <b>Reassign court</b> on a called court, or <b>Hold court</b> to stop auto-calling so you can choose players yourself. Who plays next by default: fewest games played first. Ties go to whoever has waited longest. Set a court's level from the menu on its card to split players by skill.</p>
      </details>
      ${App.tools()?`<details class="panel" id="demoPanel" ${S.ui&&S.ui.demo?'open':''}><summary>Demo tools</summary>
        <div class="row"><button class="btn" data-act="skip" data-m="1">Skip 1 min</button><button class="btn" data-act="skip" data-m="5">Skip 5 min</button><button class="btn" data-act="arriveAll">Mark all called players here</button><button class="btn" data-act="finishAll">Finish all games (random scores)</button></div>
        <p class="muted" style="margin:10px 0 0">For trying the flow without real games. Ignore these at a real session.</p>
      </details>`:''}
    </div>
    <div class="stack">
      ${(()=>{const L=App.sessionLeaders(S.id,5);return `<section class="panel"><h2>Top players tonight <small><button class="btn sm" data-app="homeSec" data-s="board">Club leaderboard</button></small></h2>${L.length?`<ol class="lead-l">${L.map((r,i)=>`<li><span class="qpos">${i+1}</span><span class="lead-n">${esc(PL(r.id).name)}</span><span class="lead-s num">${r.w}–${r.g-r.w} · ${r.diff>0?'+':''}${r.diff}</span></li>`).join('')}</ol>`:'<p class="muted" style="margin:0">Leaders show here once games are scored.</p>'}</section>`})()}
      <section class="panel"><h2>Line <small>${k.waiting} waiting</small></h2><ul class="qlist">${qrows||'<li><span></span><span class="muted">Nobody in line.</span></li>'}</ul></section>
      <section class="panel"><h2>On break <small>${resting.length+playing.length}</small></h2>
        <ul class="qlist">${resting.map(id=>`<li><span class="qpos">–</span><div style="min-width:0"><div class="qname">${esc(PL(id).name)}</div><div class="qmeta">${C(id).games} games · keeps their place</div></div><div class="qacts"><button class="btn sm primary" data-act="back" data-id="${id}">Back in line</button><button class="btn sm" data-act="bump" data-id="${id}">Play next</button><button class="btn sm danger" data-act="leave" data-id="${id}">Leave</button></div></li>`).join('')}
        ${playing.map(id=>`<li><span class="qpos">–</span><div style="min-width:0"><div class="qname">${esc(PL(id).name)}</div><div class="qmeta">${C(id).leaveAfter?'Leaving':'Break'} after this game</div></div><div class="qacts"><button class="btn sm" data-act="back" data-id="${id}">Undo</button></div></li>`).join('')}
        ${resting.length+playing.length?'':'<li><span></span><span class="muted">Nobody on break.</span></li>'}</ul></section>
      <section class="panel"><h2>Check in</h2>
        <div class="roster"><ul class="qlist">${notHere.map(p=>`<li><span class="qpos">–</span><div style="min-width:0"><div class="qname">${esc(p.name)} <span class="skill">${p.skill.toFixed(1)}</span></div><div class="qmeta">${C(p.id)?'Left · '+C(p.id).games+' games today':'Not checked in'}${p.pin?' · PIN '+esc(p.pin):''}</div></div><div class="qacts"><button class="btn sm primary" data-act="checkin" data-id="${p.id}">Check in</button></div></li>`).join('')||'<li><span></span><span class="muted">Everyone registered is here.</span></li>'}</ul></div>
        <form id="newForm" class="grid2" style="margin-top:12px">
          <label class="f">New player name<input type="text" id="newName" required placeholder="e.g. Marco Dela Cruz"></label>
          <label class="f">Skill level<select id="newSkill">${[2.5,3,3.5,4,4.5,5].map(s=>`<option ${s===3?'selected':''}>${s.toFixed(1)}</option>`).join('')}</select></label>
          <label class="f">6-digit PIN<input type="text" id="newPin" inputmode="numeric" maxlength="6" placeholder="Blank = make one up"></label>
          <button class="btn primary" type="submit" style="align-self:end">Register and check in</button>
        </form></section>
      <section class="panel"><h2>Pair partners</h2>
        <p class="muted" style="margin:0 0 10px">Paired players are always called together as teammates.</p>
        <div class="grid2"><select id="pairA" aria-label="First player">${opt(here)}</select><select id="pairB" aria-label="Second player">${opt(here.slice(1).concat(here.slice(0,1)))}</select></div>
        <div class="row" style="margin-top:8px"><button class="btn primary" data-act="pairSel">Pair them</button><button class="btn" data-act="unpairSel">Unpair first player</button></div>
      </section>
    </div>
  </div>`;
}

function renderPlayer(){
  const loginOpts=S.players.filter(p=>p.club||C(p.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${me===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  let body;
  if(!me){
    body=`<div class="hero"><div class="eyebrow">Sign in</div><div class="sub">Pick your name and enter your 6-digit PIN.</div></div>
      <form id="loginForm" style="display:grid;gap:10px"><label class="f">Name<select id="loginId">${loginOpts}</select></label>
      <label class="f">PIN<input type="password" id="loginPin" inputmode="numeric" maxlength="6"></label>
      <div class="err" id="loginErr"></div><button class="btn primary" type="submit" style="padding:10px" ${S.players.some(p=>p.club)?'':'disabled'}>Sign in</button></form>
      <details class="newbie"><summary>New here? Register</summary>
      <form id="regForm" style="display:grid;gap:10px;margin-top:10px"><label class="f">Full name<input type="text" id="regName" autocomplete="name"></label>
      <label class="f">Skill level<select id="regSkill">${[2.5,3,3.5,4,4.5,5].map(s=>`<option ${s===3?'selected':''}>${s.toFixed(1)}</option>`).join('')}</select></label>
      <label class="f">Choose a 6-digit PIN<input type="password" id="regPin" inputmode="numeric" maxlength="6"></label>
      <div class="err" id="regErr"></div><button class="btn" type="submit" style="padding:10px">Register</button></form></details>`;
  }else{
    const p=PL(me),c=C(me);let hero,acts='';
    const m=S.matches.find(x=>(x.status==='assigned'||x.status==='play')&&[...x.a,...x.b].includes(me));
    if(!c||c.status==='left'){
      hero=`<div class="hero"><div class="eyebrow">${c?'You checked out':'Not checked in'}</div><div class="big">Hi, ${esc(p.name.split(' ')[0])}</div><div class="sub">Check in to join the line for ${esc(S.session.name)}.</div></div>`;
      acts=`<button class="btn primary full" data-act="pcheckin" ${S.session.open?'':'disabled'}>Check in</button>`;
    }else if(c.status==='waiting'){
      const ps=positionOf(me);
      if(ps.held){hero=`<div class="hero"><div class="eyebrow">In line</div><div class="big">Waiting</div><div class="sub">You'll be called together with ${esc(short(c.pairWith))} once they're free.</div></div>`}
      else hero=`<div class="hero"><div class="eyebrow">You're in line</div><div class="big">#${ps.pos+1}</div><div class="sub">${ps.pos<4?'You\'re in the next group. Stay close to the courts.':`About ${mins(estWait(ps.pos))} min wait · ${ps.pos} player${ps.pos===1?'':'s'} ahead of you`}</div></div>`;
      acts=`<button class="btn" data-act="prest">Take a break</button><button class="btn danger" data-act="pleave">Leave for today</button>`;
    }else if(c.status==='resting'){
      hero=`<div class="hero h-resting"><div class="eyebrow">On a break</div><div class="big">Paused</div><div class="sub">You keep your place in line but won't be called until you're back.</div></div>`;
      acts=`<button class="btn primary" data-act="pback">I'm back</button><button class="btn danger" data-act="pleave">Leave for today</button>`;
    }else if(m){
      const mine=m.a.includes(me)?m.a:m.b,opp=m.a.includes(me)?m.b:m.a,mate=mine.find(x=>x!==me);
      if(m.status==='assigned'){
        hero=`<div class="hero h-assigned"><div class="eyebrow">You're up</div><div class="big">Court ${m.court}</div>
          <div class="teamline">With <b>${esc(short(mate))}</b> vs ${opp.map(x=>esc(short(x))).join(' & ')}</div>
          <div class="sub">${m.confirmed[me]?'Thanks. Waiting for the others.':'Tap "I\'m on court" within <b class="clock" style="font-size:16px" data-due="'+(m.assignedAt+S.session.noShow*1000)+'">'+fmt(m.assignedAt+S.session.noShow*1000-now())+'</b> or the next player takes your spot.'}</div></div>`;
        acts=m.confirmed[me]?`<button class="btn full" disabled>You're checked in on court</button>`:`<button class="btn ball full" data-act="pconfirm">I'm on court</button>`;
      }else{
        hero=`<div class="hero h-playing"><div class="eyebrow">Playing now</div><div class="big">Court ${m.court}</div>
          <div class="teamline">With <b>${esc(short(mate))}</b> vs ${opp.map(x=>esc(short(x))).join(' & ')}</div>
          <div class="sub">Game time <b class="clock" style="font-size:16px" data-since="${m.start}">${fmt(now()-m.start)}</b></div></div>`;
        acts=`<button class="btn primary full" data-act="pscore">Enter final score</button>`;
      }
      acts+=c.restAfter||c.leaveAfter?`<button class="btn full" data-act="pback">Undo: ${c.leaveAfter?'leaving':'break'} after this game</button>`:`<button class="btn" data-act="prest">Break after this game</button><button class="btn danger" data-act="pleave">Leave after this game</button>`;
    }
    const others=Object.keys(S.checkins).filter(id=>id!==me&&C(id).status!=='left'&&!C(id).pairWith).sort((a,b)=>PL(a).name.localeCompare(PL(b).name));
    const pairBox=c&&c.status!=='left'?(c.pairWith?`<div class="row"><span>Playing as a pair with <b>${esc(PL(c.pairWith).name)}</b></span><button class="btn sm" data-act="punpair">Unpair</button></div>`
      :`<div style="display:grid;gap:6px"><span class="eyebrow">Play with a partner</span><div class="row"><select id="ppair" aria-label="Partner" style="flex:1">${others.map(id=>`<option value="${id}">${esc(PL(id).name)}</option>`).join('')}</select><button class="btn" data-act="ppairgo" ${others.length?'':'disabled'}>Pair</button></div></div>`):'';
    const mine=S.matches.filter(x=>x.status==='done'&&[...x.a,...x.b].includes(me)).reverse();
    const hist=mine.length?`<table class="mini-table"><thead><tr><th>Court</th><th>Partner</th><th>Score</th><th></th></tr></thead><tbody>${mine.map(x=>{const inA=x.a.includes(me),my=inA?x.sa:x.sb,th=inA?x.sb:x.sa,mt=(inA?x.a:x.b).find(i=>i!==me);return `<tr><td>${x.court}</td><td>${esc(short(mt))}</td><td class="num">${my}–${th}</td><td><span class="pill ${my>th?'p-waiting':'p-left'}">${my>th?'Won':'Lost'}</span></td></tr>`}).join('')}</tbody></table>`:'<span class="muted">No games yet today.</span>';
    const rk=App.playerRank(me);
    const rankCard=rk?`<div class="rankcard"><div><span class="eyebrow">Club leaderboard</span><div class="rk-big">${rk.rank?'#'+rk.rank+' <small>of '+rk.of+'</small>':'Not ranked yet'}</div><div class="li-m">${rk.rank?'':'Play '+Math.max(0,5-rk.g)+' more game'+(5-rk.g===1?'':'s')+' to get a rank · '}${rk.g} game${rk.g===1?'':'s'} · ${Math.round(rk.wp*100)}% wins</div></div><div class="rk-r"><span class="eyebrow">Rating</span><b class="num">${rk.rating}</b></div></div>`:'';
    body=`${App.pushCard(me)}${hero}<div class="pacts">${acts}</div>${pairBox}${rankCard}<div style="display:grid;gap:6px"><span class="eyebrow">Today · ${c?c.games:0} game${c&&c.games===1?'':'s'}, ${c?c.wins:0} win${c&&c.wins===1?'':'s'}</span>${hist}</div>`;
  }
  return `<div class="phone-wrap"><div class="phone"><div class="phone-top"><img class="logo-sm" src="${LOGO_TILE}" alt=""><b>Next Point</b>${me?`<span class="muted" style="margin-left:auto">${esc(PL(me).name)}</span><button class="btn sm" data-act="logout">Switch</button>`:''}</div>${body}</div>
  <div class="guide panel"><h2>What players see</h2>
   <p>This is the phone screen a player gets after scanning the check-in code at the venue. Sign in as different players to see each state.</p>
   <ol><li><b>In line:</b> their place and an estimated wait, based on how long recent games took.</li>
   <li><b>Called:</b> court number, partner, opponents, and a countdown to confirm they're on court.</li>
   <li><b>Playing:</b> game timer and a button to enter the final score.</li>
   <li><b>On break:</b> they keep their place but are skipped until they tap "I'm back".</li></ol>
   </div></div>`;
}

function renderLog(){
  const done=S.matches.filter(m=>m.status==='done'||m.status==='void').slice().reverse();
  const nm=(t,w)=>`<span class="${w?'w':''}">${t.map(x=>esc(short(x))).join(' & ')}</span>`;
  const rows=done.map(m=>`<tr><td class="num">${clockStr(m.start||m.assignedAt)}</td><td>${m.court}${m.manual?' <span class="pill p-resting">Admin</span>':''}</td><td>${nm(m.a,m.sa>m.sb)}</td><td class="score">${m.status==='void'?'<span class="pill p-left">Stopped</span>':m.sa+'–'+m.sb}</td><td>${nm(m.b,m.sb>m.sa)}</td><td class="num">${m.start&&m.status==='done'?mins(m.end-m.start)+' min':'–'}</td></tr>`).join('');
  const stats=Object.keys(S.checkins).map(id=>({id,...C(id)})).sort((a,b)=>b.games-a.games||b.wins-a.wins);
  return App.pageHead('Open play · '+esc(S.session.name),'Match log','')+`<div class="loggrid"><section class="panel"><h2>Games today <small>${done.filter(m=>m.status==='done').length} finished · avg ${mins(avgGame())} min</small></h2>
    <div class="tablebox"><table class="log"><thead><tr><th>Start</th><th>Court</th><th>Team A</th><th>Score</th><th>Team B</th><th>Length</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">No games yet.</td></tr>'}</tbody></table></div></section>
    <section class="panel"><h2>Players today</h2><div class="tablebox"><table class="mini-table"><thead><tr><th>Player</th><th>Games</th><th>Wins</th><th>Status</th></tr></thead><tbody>
    ${stats.map(s=>`<tr><td>${esc(PL(s.id).name)}</td><td class="num">${s.games}</td><td class="num">${s.wins}</td><td><span class="pill p-${s.status}">${{waiting:'In line',playing:'On court',resting:'On break',left:'Left'}[s.status]}</span></td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="margin:10px 0 0">Fewest-games-first keeps the spread tight: compare the top and bottom of the Games column.</p></section></div>`;
}

function render(){App.render()}
function html(v){view=v;
  if(v==='admin')return opSub==='log'?renderLog():renderAdmin();
  return v==='tv'?renderTV():renderPlayer();
}
function after(v){App.alerts(v==='player'?opAlerts():null);renderModal()}
function opAlerts(){if(!me)return[];const m=S.matches.find(x=>x.status==='assigned'&&[...x.a,...x.b].includes(me));if(!m)return[];
  const mine=m.a.includes(me)?m.a:m.b,opp=m.a.includes(me)?m.b:m.a,mate=mine.find(x=>x!==me);
  return[{key:'op:'+S.id+':'+m.id+':'+m.court,title:"You're up",big:'Court '+m.court,sub:(mate?'With '+short(mate)+' ':'')+'vs '+opp.map(short).join(' & ')}]}
function notices(){const out=[],t=now();if(!S.session)return out;
  S.matches.forEach(m=>{if(m.status!=='assigned'||!m.assignedAt||t-m.assignedAt>15*60000)return;
    [...m.a,...m.b].forEach(pid=>{if(!PL(pid))return;const mine=m.a.includes(pid)?m.a:m.b,opp=m.a.includes(pid)?m.b:m.a,mate=mine.find(x=>x!==pid);
      out.push({tag:'c:'+S.id+':'+m.id+':'+m.court+':'+m.assignedAt+':'+pid,pids:[pid],kind:'call',title:'Court '+m.court+": you're up",body:(mate?'With '+short(mate)+' ':'')+'vs '+opp.map(short).join(' & ')+'. Tap "I\'m on court" when you get there.',url:'#player'})})});
  if(S.session.open&&S.matches.some(m=>m.assignedAt&&t-m.assignedAt<30*60000)&&!S.courts.some(c=>c.state==='free'&&!c.hold))

const TM=(()=>{

const YEAR=new Date().getFullYear();
let schedDay=null;
let S,view='admin',sub='live',me=null,refMe=null,refSel=null,modal=null,pubDiv=null,regDiv='all',drawDiv=null,editDiv=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+S.offset;
const PL=id=>S.players.find(p=>p.id===id);
const D=id=>S.divs.find(d=>d.id===id);
const E=id=>S.entries.find(e=>e.id===id);
const M=id=>S.matches.find(m=>m.id===id);
const CT=no=>S.courts.find(c=>c.no===+no);
const OF=id=>S.officials.find(o=>o.id===id);
const fmt=ms=>{const neg=ms<0;ms=Math.abs(ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return(neg?'-':'')+m+':'+String(s).padStart(2,'0')};
const mins=ms=>Math.max(0,Math.round(ms/60000));
const clockStr=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const pshort=id=>{const n=PL(id).name.split(' ');return n[0][0]+'. '+n.slice(1).join(' ')};
const ename=id=>{if(!id)return 'TBD';const e=E(id);return D(e.div).type==='singles'?PL(e.p[0]).name:e.p.map(pshort).join(' / ')};
const save=()=>App.save();
function toast(t){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function audit(who,what){S.audit.push({t:now(),who,what});if(S.audit.length>200)S.audit.shift()}
let rs=20261121;const rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;

/* ---------- divisions & rules ---------- */
const GW={men:"Men's",women:"Women's",mixed:'Mixed',open:'Open'};
function autoName(d){
  let n=GW[d.gender]+' '+(d.type==='singles'?'Singles':'Doubles');
  const r=d.rating;
  if(r.rule==='each'||r.rule==='avg')n+=' '+(+r.v).toFixed(1);
  if(r.rule==='sum')n+=' '+(+r.v).toFixed(1)+' combined';
  if(r.rule==='range')n+=' '+(+r.v).toFixed(1)+'–'+(+r.v2).toFixed(2);
  if(d.age.rule==='min')n+=' '+d.age.v+'+';
  if(d.age.rule==='max')n+=' U'+d.age.v;
  return n;
}
const dname=d=>d.custom||autoName(d);
function ruleText(d){
  const r=d.rating,out=[d.type==='singles'?'Singles':'Doubles',{men:'Men only',women:'Women only',mixed:'1 man + 1 woman',open:'Anyone'}[d.gender]];
  out.push({none:'No rating limit',each:'Each player ≤ '+r.v,avg:'Team average ≤ '+r.v,sum:'Team combined ≤ '+r.v,range:'Rating '+r.v+'–'+r.v2}[r.rule]);
  if(d.age.rule!=='none')out.push(d.age.rule==='min'?'Age '+d.age.v+'+':'Under '+d.age.v);
  out.push('Max '+d.cap+(d.type==='singles'?' players':' teams'));
  return out;
}
const scoreText=s=>(s.bo>1?'Best of '+s.bo+', ':'1 game, ')+'to '+s.to;
function stageScore(m){const d=D(m.div);if(m.stage==='pool')return d.score.pool;return ['Final','Semifinal','3rd place'].includes(m.label)?d.score.fin:d.score.po}

/* ---------- ratings & checks ---------- */
const prate=(pid,t)=>{const p=PL(pid),r=t==='singles'?p.s:p.d;return r??p.self};
const pNR=(pid,t)=>(t==='singles'?PL(pid).s:PL(pid).d)==null;
const isNR=e=>e.p.some(pid=>pNR(pid,D(e.div).type));
const erate=e=>{const t=D(e.div).type,r=e.p.map(pid=>prate(pid,t));return r.reduce((a,b)=>a+b,0)/r.length};
const active=div=>S.entries.filter(e=>e.div===div&&e.status==='in');
function checks(e){
  const d=D(e.div),t=d.type,ps=e.p.map(PL),out=[],r=d.rating,rs=e.p.map(pid=>prate(pid,t));
  if(d.gender==='men'&&ps.some(p=>p.g!=='M'))out.push(['gender','Not all players are men']);
  if(d.gender==='women'&&ps.some(p=>p.g!=='F'))out.push(['gender','Not all players are women']);
  if(d.gender==='mixed'&&!(ps.some(p=>p.g==='M')&&ps.some(p=>p.g==='F')))out.push(['gender','Mixed needs one man and one woman']);
  const avg=rs.reduce((a,b)=>a+b,0)/rs.length,sum=rs.reduce((a,b)=>a+b,0);
  if(r.rule==='each'&&rs.some(x=>x>r.v+1e-9))out.push(['rating','A player is rated above '+r.v]);
  if(r.rule==='avg'&&avg>r.v+1e-9)out.push(['rating','Team average '+avg.toFixed(3)+' is above '+r.v]);
  if(r.rule==='sum'&&sum>r.v+1e-9)out.push(['rating','Team combined '+sum.toFixed(3)+' is above '+r.v]);
  if(r.rule==='range'&&(avg<r.v||avg>r.v2))out.push(['rating','Rating '+avg.toFixed(3)+' is outside '+r.v+'–'+r.v2]);
  if(d.age.rule==='min'&&ps.some(p=>YEAR-p.by<d.age.v))out.push(['age','A player is under '+d.age.v]);
  if(d.age.rule==='max'&&ps.some(p=>YEAR-p.by>=d.age.v))out.push(['age','A player is '+d.age.v+' or older']);
  if(e.status!=='out'&&S.entries.some(o=>o!==e&&o.div===e.div&&o.status!=='out'&&o.p.some(x=>e.p.includes(x))))out.push(['dup','A player is already entered in this division']);
  const f=out.map(([k,msg])=>({k,msg,ok:!!(e.accepted&&e.accepted[k])}));
  if(isNR(e))f.push({k:'nr',msg:'No DUPR rating: seeded by self-rating',ok:true,info:true});
  return f;
}
const blocking=e=>checks(e).filter(f=>!f.ok);

/* ---------- draw & schedule ---------- */
function autoSeed(divId){
  const es=active(divId).sort((a,b)=>(erate(b)-(isNR(b)?1e-4:0))-(erate(a)-(isNR(a)?1e-4:0)));
  es.forEach((e,i)=>e.seed=i+1);
}
function seeded(divId){const es=active(divId);if(es.some(e=>!e.seed)||new Set(es.map(e=>e.seed)).size!==es.length)autoSeed(divId);return active(divId).sort((a,b)=>a.seed-b.seed)}
function makePools(es){
  const n=es.length,np=n<=5?1:Math.ceil(n/4),pools=Array.from({length:np},(_,i)=>({name:String.fromCharCode(65+i),entries:[]}));
  es.forEach((e,i)=>{const row=Math.floor(i/np),k=i%np;pools[row%2?np-1-k:k].entries.push(e.id)});
  return pools;
}
function rr(ids){const t=[...ids];if(t.length%2)t.push(null);const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)pr.push([a,b])}rounds.push(pr);t.splice(1,0,t.pop())}return rounds}
function mkMatch(o){const m={id:'m'+(++S.seq),status:'queued',games:[],court:null,calledAt:null,start:null,end:null,winner:null,verified:true,result:'',bump:null,here:{a:false,b:false},...o};S.matches.push(m);return m}
function queueBase(){const q=S.matches.filter(m=>m.status==='queued');return q.length?Math.floor(Math.min(...q.map(m=>m.ord))):Math.ceil(Math.max(0,...S.matches.map(m=>m.ord||0)))}
function lockDraw(divId,base){
  const d=D(divId),es=seeded(divId);
  d.pools=makePools(es);d.status='live';d.bracket=null;
  base=base??queueBase();
  d.pools.forEach((p,pi)=>rr(p.entries).forEach((round,ri)=>round.forEach(([a,b],k)=>mkMatch({div:divId,stage:'pool',pool:p.name,round:ri+1,a,b,ord:base+ri+1+pi*.1+k*.01+S.divs.indexOf(d)*.001}))));
  S.entries.filter(e=>e.div===divId&&e.status==='wait').forEach(e=>e.status='out');
  audit('Admin','Locked draw for '+dname(d)+' ('+es.length+' entries, '+d.pools.length+' pool'+(d.pools.length>1?'s':'')+')');
}

/* ---------- standings ---------- */
const pts=m=>m.games.reduce((a,g)=>[a[0]+g[0],a[1]+g[1]],[0,0]);
function standings(d,p){
  const ms=S.matches.filter(m=>m.div===d.id&&m.stage==='pool'&&m.pool===p.name);
  const row={};p.entries.forEach(id=>row[id]={id,p:0,w:0,l:0,pf:0,pa:0,diff:0,tb:'',seed:E(id).seed});
  ms.filter(m=>m.status==='done').forEach(m=>{const[a,b]=pts(m),A=row[m.a],B=row[m.b];A.p++;B.p++;A.pf+=a;A.pa+=b;B.pf+=b;B.pa+=a;if(m.winner===m.a){A.w++;B.l++}else{B.w++;A.l++}});
  const rows=Object.values(row);rows.forEach(r=>r.diff=r.pf-r.pa);
  const byW={};rows.forEach(r=>(byW[r.w]=byW[r.w]||[]).push(r));
  const out=[];
  Object.keys(byW).map(Number).sort((a,b)=>b-a).forEach(w=>{
    const g=byW[w];
    if(g.length===1||g.every(r=>r.p===0)){g.sort((a,b)=>b.diff-a.diff||a.seed-b.seed);out.push(...g);return}
    if(g.length===2){const h=ms.find(m=>m.status==='done'&&[m.a,m.b].includes(g[0].id)&&[m.a,m.b].includes(g[1].id));
      if(h){g.sort((a,b)=>a.id===h.winner?-1:b.id===h.winner?1:0);g.forEach(r=>r.tb='Head-to-head');out.push(...g);return}}
    const ids=new Set(g.map(r=>r.id));g.forEach(r=>{r.td=0;ms.filter(m=>m.status==='done'&&ids.has(m.a)&&ids.has(m.b)).forEach(m=>{const[a,b]=pts(m);if(m.a===r.id)r.td+=a-b;if(m.b===r.id)r.td+=b-a})});
    g.sort((a,b)=>b.td-a.td||b.diff-a.diff||b.pf-a.pf||a.seed-b.seed);
    g.forEach((r,i)=>{const o=g[i+1]||g[i-1];r.tb=o.td!==r.td?'Pt diff among tied':o.diff!==r.diff?'Pt diff':o.pf!==r.pf?'Points scored':'Seed'});
    out.push(...g);
  });
  return out;
}

/* ---------- bracket ---------- */
function seedPos(n){let a=[1,2];while(a.length<n){const k=a.length*2+1;a=a.flatMap(x=>[x,k-x])}return a}
function roundLabel(i,total){const fromEnd=total-1-i;return fromEnd===0?'Final':fromEnd===1?'Semifinal':fromEnd===2?'Quarterfinal':'Round of '+Math.pow(2,fromEnd+1)}
function buildBracket(d){
  const W=[],R=[];d.pools.forEach(p=>{const st=standings(d,p);W.push(st[0]);if(st[1])R.push(st[1])});
  const srt=a=>a.sort((x,y)=>y.w-x.w||y.diff-x.diff||y.pf-x.pf);
  const q=[...srt(W),...srt(R)].map(r=>r.id);
  let B=2;while(B<q.length)B*=2;
  const total=Math.log2(B),pos=seedPos(B),base=Math.ceil(Math.max(0,...S.matches.map(m=>m.ord||0)));
  const rounds=[];
  for(let r=0;r<total;r++){const n=B/Math.pow(2,r+1),lab=roundLabel(r,total);rounds.push(Array.from({length:n},(_,i)=>mkMatch({div:d.id,stage:'po',label:lab,round:r+1,slot:i,a:null,b:null,ord:base+r+1+i*.01})))}
  rounds.forEach((rd,r)=>{if(r<total-1)rd.forEach((m,i)=>{m.next=rounds[r+1][Math.floor(i/2)].id;m.nextSide=i%2?'b':'a'})});
  let third=null;
  if(d.third&&B>=4){third=mkMatch({div:d.id,stage:'po',label:'3rd place',round:total,slot:1,a:null,b:null,ord:base+total+.5});rounds[total-2].forEach((m,i)=>{m.loserNext=third.id;m.loserSide=i?'b':'a'})}
  rounds[0].forEach((m,i)=>{m.a=q[pos[2*i]-1]||null;m.b=q[pos[2*i+1]-1]||null;m.seedA=pos[2*i];m.seedB=pos[2*i+1]});
  rounds[0].forEach(m=>{if(!m.a||!m.b){m.status='done';m.result='bye';m.winner=m.a||m.b;m.end=now();advance(m)}});
  d.bracket={rounds:rounds.map(r=>r.map(m=>m.id)),third:third&&third.id};
  audit('System','Pools finished in '+dname(d)+'. Playoff bracket of '+q.length+' created.');
}
function advance(m){
  if(m.next){const n=M(m.next);n[m.nextSide]=m.winner}
  if(m.loserNext&&m.result!=='bye'){const n=M(m.loserNext);n[m.loserSide]=m.winner===m.a?m.b:m.a}
}
function divProgress(d){
  if(d.status!=='live')return;
  const pool=S.matches.filter(m=>m.div===d.id&&m.stage==='pool');
  if(!d.bracket&&pool.every(m=>m.status==='done')){if(d.pools.length===1){d.status='done';audit('System',dname(d)+' finished (round robin).')}else buildBracket(d)}
  if(d.bracket){const f=M(d.bracket.rounds[d.bracket.rounds.length-1][0]),t=d.bracket.third&&M(d.bracket.third);if(f.status==='done'&&(!t||t.status==='done')){d.status='done';audit('System',dname(d)+' finished.')}}
}
function podium(d){
  if(d.status!=='done')return null;
  if(!d.bracket){const st=standings(d,d.pools[0]);return st.slice(0,3).map(r=>r.id)}
  const f=M(d.bracket.rounds[d.bracket.rounds.length-1][0]),t=d.bracket.third&&M(d.bracket.third);
  const sec=f.winner===f.a?f.b:f.a;
  if(t)return[f.winner,sec,t.winner];
  return[f.winner,sec,null];
}

/* ---------- live court queue ---------- */
function busy(){const s=new Set();S.matches.forEach(m=>{if(m.status==='called'||m.status==='play')[m.a,m.b].forEach(e=>E(e).p.forEach(p=>s.add(p)))});return s}
function lastEnds(){const t={};S.matches.forEach(m=>{if(m.status==='done'&&m.result!=='bye')[m.a,m.b].forEach(e=>e&&E(e).p.forEach(p=>t[p]=Math.max(t[p]||0,m.end)))});return t}
function readyInfo(m,bz,le){
  if(m.status!=='queued')return{ok:false,why:''};
  if(D(m.div).status!=='live')return{ok:false,why:'Division not live'};
  if(!m.a||!m.b)return{ok:false,why:'Waiting for earlier results'};
  const ps=[...E(m.a).p,...E(m.b).p];
  if(ps.some(p=>bz.has(p)))return{ok:false,why:'A player is on court'};
  const tired=ps.some(p=>(le[p]||0)>now()-S.cfg.rest*60000);
  return{ok:true,rested:!tired,why:tired?'Resting (min '+S.cfg.rest+' min)':'Ready'};
}

/* ---------- schedule (assisted, never fully automatic) ----------
   A block = one division stage (pools / round robin, or playoffs). Blocks run in the order the
   desk sets. Each block starts after the one before it, at a set time, or only when the desk
   starts it. The court queue only calls matches from open blocks; the desk can always override. */
const hm=v=>{const [h,mm]=String(v||'0:0').split(':').map(Number);return (h||0)*60+(mm||0)};
const fmtT=min=>{min=Math.round(min);const h=Math.floor(min/60),mm=((min%60)+60)%60,h24=((h%24)+24)%24;return (h24%12||12)+':'+String(mm).padStart(2,'0')+' '+(h24<12?'AM':'PM')};
const nowMin=()=>{const d=new Date(now());return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const toMin=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const r5=m=>Math.round(m/5)*5;
function newBlock(div,stage,day){return{id:App.uid('b'),div,stage,day,mode:'follow',at:'13:00',courts:null,released:false,hold:false}}
function needsPo(d){return d.status==='open'?active(d.id).length>=6:d.pools.length>1}
function sched(){
  if(!S.sched)S.sched={days:[{label:'Day 1',start:'08:00',end:'18:00'}],today:0,pace:{11:15,15:20,21:25},buffer:3,blocks:[],plan:null};
  const sc=S.sched;
  sc.blocks=sc.blocks.filter(b=>{const d=D(b.div);return d&&(b.stage==='pool'||needsPo(d))});
  S.divs.forEach(d=>{
    if(!sc.blocks.some(b=>b.div===d.id&&b.stage==='pool'))sc.blocks.push(newBlock(d.id,'pool',Math.min(sc.today,sc.days.length-1)));
    if(needsPo(d)&&!sc.blocks.some(b=>b.div===d.id&&b.stage==='po')){const pb=sc.blocks.find(b=>b.div===d.id&&b.stage==='pool');sc.blocks.push(newBlock(d.id,'po',pb?pb.day:0))}
  });
  sc.blocks.forEach(b=>{if(b.day>sc.days.length-1)b.day=sc.days.length-1});
  if(sc.today>sc.days.length-1)sc.today=sc.days.length-1;
  return sc;
}
const ordered=()=>sched().blocks.map((b,i)=>({b,i})).sort((x,y)=>x.b.day-y.b.day||x.i-y.i).map(x=>x.b);
const stageName=b=>b.stage==='po'?'Playoffs':needsPo(D(b.div))?'Pools':'Round robin';
const blockName=b=>dname(D(b.div))+' · '+stageName(b);
const blockMatches=b=>S.matches.filter(m=>m.div===b.div&&(b.stage==='pool'?m.stage==='pool':m.stage==='po')&&m.result!=='bye');
function blockState(b){
  const d=D(b.div);if(d.status==='open')return 'draft';
  if(b.stage==='po'&&!d.bracket)return d.status==='done'?'done':'after';
  const ms=blockMatches(b);if(ms.length&&ms.every(m=>m.status==='done'))return 'done';
  return ms.some(m=>m.status!=='queued')?'playing':'ready';
}
function schedGate(){
  const sc=sched(),out=new Map(),nm=nowMin();let open=true,closer=null;
  for(const b of ordered()){
    const st=blockState(b);let own=true,why='';
    if(b.day>sc.today){own=false;why='Scheduled for '+sc.days[b.day].label}
    else if(b.mode==='manual'&&!b.released){own=false;why='Starts when the desk starts it'}
    else if(b.mode==='time'&&!b.released&&b.day===sc.today&&nm<hm(b.at)){own=false;why='Scheduled for '+fmtT(hm(b.at))}
    const ok=open&&own&&!b.hold;
    out.set(b.id,{open:ok,state:st,why:b.hold?'Paused by the desk':!own?why:!open?'After '+blockName(closer):''});
    if(open&&!own&&st!=='done'&&st!=='draft'){open=false;closer=b}
  }
  return out;
}
function blockMap(){const mp=new Map();sched().blocks.forEach(b=>mp.set(b.div+'|'+b.stage,b));return mp}
const blockOfM=(mp,m)=>mp.get(m.div+'|'+(m.stage==='pool'?'pool':'po'));
function courtOk(m,ct){const b=blockOfM(blockMap(),m);return !b||!b.courts||!b.courts.length||b.courts.includes(ct.no)}
function matchLen(d,stage,late){const sc=sched(),f=stage==='pool'?d.score.pool:late?d.score.fin:d.score.po;return (sc.pace[f.to]||15)*(f.bo>1?2.5:1)+(+sc.buffer||0)}
function poolShape(n){if(n<3)return [];const np=n<=5?1:Math.ceil(n/4),sz=Array(np).fill(0);for(let i=0;i<n;i++)sz[i%np]++;return sz}
function blockWork(b){
  const d=D(b.div);
  if(b.stage==='pool'){
    const L=matchLen(d,'pool');
    if(d.status==='open'){const sz=poolShape(active(d.id).length),n=sz.reduce((a,k)=>a+k*(k-1)/2,0),r=sz.length?Math.max(...sz.map(k=>k%2?k:k-1)):0;return{cm:n*L,n,rt:r*L}}
    const left=S.matches.filter(m=>m.div===d.id&&m.stage==='pool'&&m.status!=='done'),per={};
    left.forEach(m=>[m.a,m.b].forEach(e=>per[e]=(per[e]||0)+1));
    const r=Object.values(per).length?Math.max(...Object.values(per)):0;return{cm:left.length*L,n:left.length,rt:r*L};
  }
  if(d.bracket){const tot=d.bracket.rounds.length,left=S.matches.filter(m=>m.div===d.id&&m.stage==='po'&&m.status!=='done'&&m.result!=='bye');
    const rs=[...new Set(left.map(m=>m.round))];
    return{cm:left.reduce((a,m)=>a+matchLen(d,'po',m.round>=tot-1),0),n:left.length,rt:rs.reduce((a,r)=>a+matchLen(d,'po',r>=tot-1),0)}}
  const np=d.status==='open'?poolShape(active(d.id).length).length:d.pools.length,q=np*2;let B=2;while(B<q)B*=2;
  const tot=Math.log2(B);let cm=0,n=0,rt=0;
  for(let r=1;r<=tot;r++){let c=B/Math.pow(2,r);if(r===1)c-=B-q;if(r===tot&&d.third&&B>=4)c+=1;const L=matchLen(d,'po',r>=tot-1);cm+=c*L;n+=c;rt+=L}
  return{cm,n,rt};
}
function project(){
  const sc=sched(),nm=nowMin(),C=S.courts.length||1,res=new Map(),poolEnd={};
  sc.days.forEach((day,di)=>{
    if(di<sc.today)return;
    const ds=hm(day.start);let T=di===sc.today?Math.max(ds,nm):ds;
    for(const b of ordered().filter(x=>x.day===di)){
      const st=blockState(b),ms=blockMatches(b);
      if(st==='done'&&ms.length){const s0=Math.min(...ms.map(m=>m.start||m.calledAt||m.end)),e0=Math.max(...ms.map(m=>m.end||0));res.set(b.id,{s:toMin(s0),e:toMin(e0),done:true,n:0});continue}
      const w=blockWork(b),c=b.courts&&b.courts.length?Math.min(b.courts.length,C):C;
      const started=ms.some(m=>m.status!=='queued');
      let s=T;
      if(b.mode==='time'&&!b.released)s=Math.max(s,hm(b.at));
      if(b.stage==='po'&&poolEnd[b.div]!=null)s=Math.max(s,poolEnd[b.div]);
      if(started&&di===sc.today)s=Math.max(nm,ds);
      const e=s+(w.n?Math.max(w.cm/c,w.rt):0);
      const shownS=started?toMin(Math.min(...ms.filter(m=>m.start||m.calledAt).map(m=>m.start||m.calledAt))):s;
      res.set(b.id,{s:shownS,e,started,n:w.n,est:!started});
      if(b.stage==='pool')poolEnd[b.div]=e;
      T=Math.max(T,s+w.cm/C);
    }
  });
  return res;
}
function planDrift(pr){const sc=sched();if(!sc.plan)return null;let worst=null;
  sc.blocks.forEach(b=>{if(b.day!==sc.today)return;const p=sc.plan.b[b.id],x=pr.get(b.id);if(!p||!x||x.done)return;const d=x.started?x.e-p.e:x.s-p.s;worst=worst==null?d:Math.max(worst,d)});return worst}
function dayFinish(pr,di){const v=ordered().filter(b=>b.day===di).map(b=>pr.get(b.id)).filter(Boolean).map(x=>x.e);return v.length?Math.max(...v):null}
function scheduleTips(){
  const sc=sched(),tips=[],day=sc.days[sc.today];if(!day||!sc.blocks.length)return tips;
  const g=schedGate(),pr=project(),q=queue(),free=S.courts.filter(c=>c.state==='free'&&!c.hold).length;
  if(free&&!q.some(x=>x.ok)){
    const nx=ordered().find(b=>{const x=g.get(b.id);return b.day<=sc.today&&x&&!x.open&&(x.state==='ready'||x.state==='playing')});
    if(nx){const x=g.get(nx.id);tips.push({k:'idle',msg:`${free} court${free>1?'s are':' is'} free and nothing else is ready. Next on the schedule: <b>${esc(blockName(nx))}</b> (${esc(x.why.toLowerCase())}).`,act:nx.hold?`<button class="btn sm primary" data-act="bkResume" data-id="${nx.id}">Resume it</button>`:`<button class="btn sm primary" data-act="bkRelease" data-id="${nx.id}">Start it now</button>`})}
  }
  ordered().forEach(b=>{if(b.day!==sc.today||b.mode!=='time'||b.released)return;const st=blockState(b);if(st==='done'||st==='draft')return;const mins=hm(b.at)-nowMin();
    if(mins>0&&mins<=15)tips.push({k:'soon',msg:`<b>${esc(blockName(b))}</b> is set to start at ${fmtT(hm(b.at))}, in ${Math.ceil(mins)} min.`,act:`<button class="btn sm" data-act="bkRelease" data-id="${b.id}">Start it now</button>`})});
  const fin=dayFinish(pr,sc.today),dEnd=hm(day.end);
  if(fin!=null&&fin>dEnd+5){const last=ordered().filter(b=>b.day===sc.today&&blockState(b)!=='done').pop();
    tips.push({k:'late',msg:`Today is projected to finish around <b>${fmtT(r5(fin))}</b>, about ${Math.round(fin-dEnd)} min after ${fmtT(dEnd)}.${last?' Options: '+(sc.days.length>sc.today+1?'move <b>'+esc(blockName(last))+'</b> to '+esc(sc.days[sc.today+1].label)+', ':'')+'add a court, or shorten later games.':''}`,act:(last&&sc.days.length>sc.today+1?`<button class="btn sm" data-act="bkNextDay" data-id="${last.id}">Move it to ${esc(sc.days[sc.today+1].label)}</button>`:'')+(sub!=='sched'?'<button class="btn sm" data-sub="sched">Open schedule</button>':'')})}
  const dr=planDrift(pr);
  if(dr!=null&&dr>=10)tips.push({k:'behind',msg:`Running about <b>${Math.round(dr)} min behind</b> the saved plan.`,act:sub!=='sched'?'<button class="btn sm" data-sub="sched">Open schedule</button>':''});
  return tips;
}
function tipsHtml(t){return t.length?`<div class="assist" role="status">${t.map(x=>`<div class="assist-i ${x.k}"><span class="assist-dot" aria-hidden="true"></span><div class="assist-m">${x.msg}</div>${x.act?`<div class="assist-a">${x.act}</div>`:''}</div>`).join('')}</div>`:''}
function queue(){
  const bz=busy(),le=lastEnds(),g=schedGate(),mp=blockMap(),oi=new Map(ordered().map((b,i)=>[b.id,i]));
  const bo=m=>{const b=blockOfM(mp,m);return b?oi.get(b.id):999};
  return S.matches.filter(m=>m.status==='queued'&&D(m.div).status==='live')
    .sort((a,b)=>(b.bump||0)-(a.bump||0)||bo(a)-bo(b)||a.ord-b.ord).map(m=>{const r=readyInfo(m,bz,le),b=blockOfM(mp,m),gt=b&&g.get(b.id);
      if(r.ok&&gt&&!gt.open&&!m.bump)return{m,ok:false,held:true,why:gt.why};return{m,...r}});
}
function nextMatch(ct){const q=queue().filter(x=>x.ok&&(!ct||courtOk(x.m,ct)));return(q.find(x=>x.rested||x.m.bump)||q[0]||{}).m}
function call(ct,m,manual){
  Object.assign(m,{status:'called',court:ct.no,calledAt:now(),here:{a:false,b:false},ref:m.ref||null,bump:null,manual:!!manual});
  ct.state='called';ct.match=m.id;
}
function autoCall(){let n=0;for(const ct of S.courts){if(ct.state!=='free'||ct.hold)continue;const m=nextMatch(ct);if(!m)continue;call(ct,m);n++}return n}
function startMatch(m){m.status='play';m.start=now();CT(m.court).state='play';initLive(m)}
function backToQueue(m){const ct=CT(m.court);Object.assign(m,{status:'queued',court:null,calledAt:null,here:{a:false,b:false}});ct.state='free';ct.match=null}
function validGame(a,b,to){
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0)return 'Enter both scores as whole numbers.';
  const hi=Math.max(a,b),lo=Math.min(a,b);
  if(hi<to)return 'The winning side needs at least '+to+' points.';
  if(hi-lo<2)return 'A game must be won by 2.';
  if(hi>to&&hi-lo!==2)return 'Past '+to+', the game ends as soon as one side leads by 2.';
  return '';
}
const winsOf=g=>g.reduce((w,x)=>(x[0]>x[1]?w[0]++:w[1]++,w),[0,0]);
function decided(m,games){const need=Math.ceil(stageScore(m).bo/2),w=winsOf(games||m.games);return w[0]>=need?'a':w[1]>=need?'b':null}
function finish(m,side,by,verified){
  const ct=m.court?CT(m.court):null;
  Object.assign(m,{status:'done',end:now(),winner:side==='a'?m.a:m.b,verified:verified!==false,by});delete m.live;
  if(ct){ct.state='free';ct.match=null}
  advance(m);divProgress(D(m.div));
}
function saveGame(m,a,b,by,verified){
  const sc=stageScore(m),err=validGame(a,b,sc.to);if(err)return err;
  m.games.push([a,b]);const w=decided(m);if(w)finish(m,w,by,verified);return '';
}
function forfeit(m,loser,type,by){
  const sc=stageScore(m),need=Math.ceil(sc.bo/2);
  if(type==='forfeit'){const w=winsOf(m.games);while((loser==='a'?w[1]:w[0])<need){m.games.push(loser==='a'?[0,sc.to]:[sc.to,0]);loser==='a'?w[1]++:w[0]++}}
  m.result=type;if(m.status==='called')m.start=m.start||now();
  finish(m,loser==='a'?'b':'a',by,true);
  audit(by,(type==='forfeit'?'Forfeit: ':'Retired: ')+ename(loser==='a'?m.a:m.b)+' ('+dname(D(m.div))+')');
}
function correct(m,games){
  const w=decided(m,games);if(!w)return 'Those scores don\'t finish the match.';
  const nw=w==='a'?m.a:m.b;
  if(nw!==m.winner){
    for(const [k,side] of [[m.next,m.nextSide],[m.loserNext,m.loserSide]]){if(k&&M(k).status!=='queued')return 'The next match already started, so the winner can\'t change. Stop that match first.'}
    m.winner=nw;if(m.next)M(m.next)[m.nextSide]=nw;if(m.loserNext)M(m.loserNext)[m.loserSide]=nw===m.a?m.b:m.a;
  }
  m.games=games;m.verified=true;m.result='';
  audit('Admin','Corrected score: '+ename(m.a)+' vs '+ename(m.b)+' → '+games.map(g=>g.join('–')).join(', '));
  divProgress(D(m.div));return '';
}

/* ---------- referee rally engine (side-out scoring) ----------
   Runs on the referee's phone. Only the finished game score is saved to the server. */
const ix=s=>s==='a'?0:1, oth=s=>s==='a'?'b':'a';
const isDbl=m=>D(m.div).type==='doubles';
const partnerOf=(m,s,pid)=>E(m[s]).p.find(x=>x!==pid)||pid;
// each player's court depends only on their own team's score: the player who started on the right is on the right when the score is even
function rightP(L,m,s){const ps=E(m[s]).p;if(ps.length===1)return ps[0];return L.score[ix(s)]%2===0?L.sr[s]:partnerOf(m,s,L.sr[s])}
const toLimit=to=>to===11?2:3;
const switchAt=to=>to===11?6:to===15?8:11;
function initLive(m){
  const prev=m.live,game=m.games.length+1;
  m.live={setup:true,game,first:prev&&prev.game!==game?oth(prev.first):'a',sr:{a:E(m.a).p[0],b:E(m.b).p[0]},
    aLeft:prev&&prev.game!==game?!prev.aLeftStart:true,aLeftStart:true,score:[0,0],serving:'a',num:2,server:null,
    hist:[],tm:{total:(S.cfg.gameMin||0)*60000,used:0,since:null},to:{a:0,b:0},toUntil:null,toTeam:null,rallies:0,replays:0,switched:false,switchPrompt:false,over:null,start:null,flip:prev?prev.flip:false};
}
function liveView(m){
  const L=m.live;let serving=L.serving,num=L.num,server=L.server;
  if(L.setup){serving=L.first;num=isDbl(m)?2:1;server=rightP(L,m,serving)}
  const rcv=oth(serving),dbl=isDbl(m);
  const side=dbl?(server===rightP(L,m,serving)?'right':'left'):(L.score[ix(serving)]%2===0?'right':'left');
  const receiver=dbl?(side==='right'?rightP(L,m,rcv):partnerOf(m,rcv,rightP(L,m,rcv))):E(m[rcv]).p[0];
  return{serving,num,server,rcv,side,receiver};
}
const snap=L=>{const{hist,...rest}=L;return JSON.parse(JSON.stringify(rest))};
const tmLeft=L=>L.tm.total-L.tm.used-(L.tm.since?now()-L.tm.since:0);
const tmPause=L=>{if(L.tm.since){L.tm.used+=now()-L.tm.since;L.tm.since=null}};
function startGame(m){const L=m.live;Object.assign(L,{setup:false,serving:L.first,num:isDbl(m)?2:1,aLeftStart:L.aLeft,start:now()});if(L.tm.total)L.tm.since=now();L.server=rightP(L,m,L.first)}
function rally(m,winner){
  const L=m.live,sc=stageScore(m);if(L.setup||L.over||L.switchPrompt)return;
  L.hist.push(snap(L));L.rallies++;
  if(winner===L.serving){
    L.score[ix(winner)]++;
    const a=L.score[ix(winner)],b=L.score[ix(oth(winner))];
    if(a>=sc.to&&a-b>=2){L.over=winner;tmPause(L)}
    else if((sc.bo===1||L.game===sc.bo)&&!L.switched&&Math.max(...L.score)===switchAt(sc.to)){L.switched=true;L.switchPrompt=true}
  }else if(isDbl(m)&&L.num===1){L.num=2;L.server=partnerOf(m,L.serving,L.server)}
  else{L.serving=oth(L.serving);L.num=1;L.server=rightP(L,m,L.serving)}
}
function undo(m){const L=m.live;if(!L.hist.length)return false;const prev=L.hist.pop();m.live={...prev,hist:L.hist,tm:L.tm};return true}
function callText(m){const L=m.live,v=liveView(m),a=L.score[ix(v.serving)],b=L.score[ix(v.rcv)];return isDbl(m)?a+'–'+b+'–'+v.num:a+'–'+b}
function pointState(m){
  const L=m.live,sc=stageScore(m),v=liveView(m),s=L.score[ix(v.serving)],r=L.score[ix(v.rcv)];
  if(s>=sc.to-1&&s>r){const g=[...m.games,v.serving==='a'?[s+1,r]:[r,s+1]];return decided(m,g)?'Match point':'Game point'}
  return '';
}

function addPlayer(o){
  const ex=S.players.find(p=>(o.dupr&&p.dupr&&p.dupr.toUpperCase()===o.dupr.toUpperCase())||(o.mobile&&p.mobile===o.mobile));
  if(ex){['g','by','d','s','self','dupr','mobile'].forEach(k=>{if(o[k]!=null&&o[k]!=='')ex[k]=o[k]});return ex.id}
  return App.addPlayer({...o,pin:App.newPin(),tmp:S.id});
}

function chips(eid,here){if(!eid)return '<span class="chip">TBD</span>';const e=E(eid);return e.p.map(p=>`<span class="chip ${here?'ok':''}">${esc(D(e.div).type==='singles'?PL(p).name:pshort(p))}</span>`).join('')}
function courtTile(ct,mode){
  const m=ct.match?M(ct.match):null,ref=m&&m.ref?OF(m.ref):null,big=mode==='public';
  const st=ct.hold&&ct.state==='free'?'hold':ct.state;
  const pill={free:'<span class="pill p-free">Open</span>',hold:'<span class="pill p-hold">On hold</span>',called:'<span class="pill p-called">Called</span>',play:'<span class="pill p-play">In play</span>'}[st];
  let clock='',what='',board='',meta='';
  if(m){
    const sc=stageScore(m),L=m.live&&!m.live.setup?m.live:null,srv=L&&m.status==='play'?liveView(m).serving:null;
    what=`${esc(dname(D(m.div)))} · ${stageLabel(m)}`;
    if(m.status==='called'){const due=m.calledAt+S.cfg.forfeit*60000;clock=`<span class="ct2-clock"><span class="clock" data-due="${due}">${fmt(due-now())}</span><small>forfeit timer</small></span>`}
    else clock=`<span class="ct2-clock"><span class="clock" data-since="${m.start}">${fmt(now()-m.start)}</span><small>match time</small></span>`;
    const okp=p=>m.status==='called'&&m.ok&&m.ok[p]===m.calledAt;
    const names=eid=>{if(!eid)return '<span class="nm tbd">TBD</span>';const e=E(eid);return e.p.map(p=>`<span class="nm ${okp(p)?'omw':''}">${esc(big||D(e.div).type==='singles'?PL(p).name:pshort(p))}${okp(p)?'<span class="omw-t" title="Tapped I\'m on my way"> ✓</span>':''}</span>`).join('')};
    const row=s=>{const i=s==='a'?0:1;let right;
      if(m.status==='called')right=`<span class="ct2-here ${m.here[s]?'ok':''}">${m.here[s]?'Here':'Not here yet'}</span>`;
      else right=`<span class="ct2-score num" aria-label="Score">${L?L.score[i]:(m.games.length?winsOf(m.games)[i]:'0')}</span>`;
      return `<div class="ct2-team ${s} ${srv===s?'serving':''}"><span class="ct2-names">${names(m[s])}</span>${srv===s?'<span class="srv-ball" role="img" aria-label="Serving"></span>':''}${right}</div>`};
    board=`<div class="ct2-board">${row('a')}${row('b')}</div>`;
    const refPart=mode==='admin'?`<label class="ct2-lvl">Ref <select data-ref="${m.id}" aria-label="Referee for court ${ct.no}"><option value="">No referee</option>${S.officials.map(o=>`<option value="${o.id}" ${m.ref===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></label>`:`<span>${ref?'Ref: '+esc(ref.name):'No referee'}</span>`;
    const silent=m.status==='called'?['a','b'].filter(s=>!m.here[s]).flatMap(s=>E(m[s]).p).filter(p=>!okp(p)):[];
    if(mode==='admin'&&silent.length&&now()-m.calledAt>90000)board+=`<div class="ct2-silent">No reply yet: ${silent.map(p=>esc(PL(p).name)).join(', ')} · call on the mic</div>`;
    meta=[refPart,`<span>${L?'Game '+L.game+(sc.bo>1?' of '+sc.bo:'')+' · to '+sc.to:scoreText(sc)}</span>`,m.games.length?`<span>Games ${gamesStr(m)}</span>`:'',m.manual?'<span class="pill p-hold">Admin pick</span>':''].filter(Boolean).join('');
  }else{
    const nx=queue()[0];
    board=`<div class="ct2-empty"><span class="ct2-empty-t">${ct.hold?'Held by the desk':'Waiting for the next match'}</span>${nx?`<span class="ct2-next">Next up: ${esc(ename(nx.m.a))} vs ${esc(ename(nx.m.b))}${nx.ok?'':' · '+esc(nx.why)}</span>`:''}</div>`;
  }
  let acts='';
  if(mode==='admin'){
    if(ct.state==='free')acts=`<button class="btn sm primary" data-act="placeModal" data-c="${ct.no}">Put a match here</button><button class="btn sm" data-act="${ct.hold?'unhold':'hold'}" data-c="${ct.no}">${ct.hold?'Release hold':'Hold court'}</button>`;
    if(ct.state==='called')acts=`<button class="btn sm primary" data-act="start" data-id="${m.id}">Start</button><button class="btn sm" data-act="requeue" data-id="${m.id}">Back to queue</button><button class="btn sm danger" data-act="forfeitModal" data-id="${m.id}">Forfeit…</button>`;
    if(ct.state==='play')acts=`<button class="btn sm primary" data-act="scoreModal" data-id="${m.id}">Enter score</button><button class="btn sm danger" data-act="forfeitModal" data-id="${m.id}">Forfeit / retire…</button>`;
    acts=`<div class="ct2-acts">${acts}</div>`;
  }
  return `<article class="ct2 s-${st} ${big?'big':''}"><header class="ct2-h"><div class="ct2-id"><span class="ct2-no">Court ${ct.no}</span>${pill}${m&&m.flag&&mode==='admin'?'<span class="pill p-flag">Flagged</span>':''}</div>${clock}</header>${what?`<div class="ct2-what">${what}</div>`:''}${board}${meta?`<div class="ct2-meta">${meta}</div>`:''}${acts}</article>`;
}

  return `<div class="tablebox"><table class="t"><thead><tr><th>#</th><th>${d.type==='singles'?'Player':'Team'}</th><th class="n">W</th><th class="n">L</th><th class="n">PF</th><th class="n">PA</th><th class="n">+/–</th></tr></thead><tbody>

function bracketView(d){
  if(!d.bracket)return '';
  const bm=id=>{const m=M(id),live=m.status==='called'||m.status==='play';
    const side=(e,s,seed)=>`<div class="tm ${m.status==='done'&&m.winner===e&&e?'w':''} ${e?'':'tbd'}"><span>${e?esc(ename(e)):(m.result==='bye'?'Bye':'TBD')}</span><span class="num">${m.status==='done'&&m.result!=='bye'?m.games.map(g=>g[s]).join(' '):''}</span></div>`;
    return `<div class="bm ${live?'live':''}"><div class="lab"><span>${m.label}</span><span>${m.status==='done'?(m.result==='bye'?'Bye':m.result?m.result[0].toUpperCase()+m.result.slice(1):'Final'):live?'Court '+m.court:'Queued'}</span></div>${side(m.a,0)}${side(m.b,1)}</div>`};
  const cols=d.bracket.rounds.map(r=>`<div class="bround"><h4>${M(r[0]).label}</h4>${r.map(bm).join('')}</div>`);
  if(d.bracket.third)cols.push(`<div class="bround"><h4>3rd place</h4>${bm(d.bracket.third)}</div>`);
  return `<div class="bracket">${cols.join('')}</div>`;
}
function podiumView(d){const p=podium(d);if(!p)return '';const k=['g','s','b'],t=['1st','2nd','3rd'];
  return `<div class="podium">${p.map((e,i)=>`<div class="pod ${k[i]}"><div class="pl">${t[i]}</div><div style="font-weight:700;margin-top:6px">${e?esc(ename(e)):'—'}</div></div>`).join('')}</div>`}
function divResults(d,hl){

}
function nextFive(){return queue().slice(0,6)}
function upcomingList(n,admin){
  const q0=queue(),free=S.courts.filter(c=>c.state==='free'&&!c.hold).length;
  // show games in the order courts will most likely take them: ready, then resting, then waiting
  const q=[...q0.filter(x=>x.ok&&x.rested),...q0.filter(x=>x.ok&&!x.rested),...q0.filter(x=>!x.ok)];
  if(!q.length)return '<p class="muted" style="margin:0">No games waiting. Games appear here when a draw is locked or the next bracket round is ready.</p>';
  let nx=0;
  return `<ol class="upc">${q.slice(0,n).map((x,i)=>{const st=x.ok&&x.rested?'ready':x.ok?'rest':'wait';const lab=st==='ready'?(nx++<Math.max(1,free)?'Next on court':'Ready'):st==='rest'?'Resting':x.why;
    return `<li class="upc-i ${st}"><span class="upc-n num">${i+1}</span><div class="upc-b"><div class="li-t">${esc(ename(x.m.a))} <span class="muted">vs</span> ${esc(ename(x.m.b))}</div><div class="li-m">${esc(dname(D(x.m.div)))} · ${stageLabel(x.m)}${x.m.bump?' · moved up':''}</div><span class="pill ${st==='ready'?'p-ok':st==='rest'?'p-hold':'p-muted'}">${esc(lab)}</span></div>${admin?`<div class="upc-a">${x.m.bump?`<button class="btn sm" data-act="unbump" data-id="${x.m.id}">Undo move</button>`:`<button class="btn sm" data-act="bump" data-id="${x.m.id}">Move to top</button>`}</div>`:''}</li>`}).join('')}</ol>${q.length>n?`<p class="tb" style="margin:10px 0 0">+ ${q.length-n} more after these</p>`:''}`;
}

function courtSVG(m){
  const L=m.live,v=liveView(m),leftTeam=L.aLeft?'a':'b';
  const P=(s,court)=>{const half=s===leftTeam?'L':'R';let x=half==='L'?88:352,y=((half==='L')===(court==='right'))?146:66;if(L.flip){x=440-x;y=212-y}return[x,y]};
  const tok=[];
  ['a','b'].forEach(s=>{const ps=E(m[s]).p;if(ps.length===1)tok.push({s,p:ps[0],xy:P(s,v.side)});else{const r=rightP(L,m,s);tok.push({s,p:r,xy:P(s,'right')},{s,p:partnerOf(m,s,r),xy:P(s,'left')})}});
  const sp=tok.find(t=>t.p===v.server).xy,rp=tok.find(t=>t.p===v.receiver).xy;
  const dx=rp[0]-sp[0],dy=rp[1]-sp[1],len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const tk=t=>{const[x,y]=t.xy,col=t.s==='a'?'A':'B',isS=t.p===v.server,isR=t.p===v.receiver;
    return `<g><circle cx="${x}" cy="${y}" r="21" style="fill:var(--team${col})" stroke="${isS?'#e6cd3a':isR?'#ffffff':'rgba(0,0,0,.25)'}" stroke-width="${isS||isR?4:1}" ${isR?'stroke-dasharray="5 4"':''}/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--team${col}-ink)">${esc(ini(t.p))}</text>
      ${isS?`<circle cx="${x+17}" cy="${y-17}" r="7" fill="#e6cd3a" stroke="#2a2400" stroke-width="1.5"/>`:''}
      <text x="${x}" y="${y+36}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">${esc(pshort(t.p))}</text>
      ${isS||isR?`<text x="${x}" y="${y+49}" text-anchor="middle" font-size="10" font-weight="700" fill="${isS?'#f3df6a':'#ffffff'}">${isS?'SERVING':'RECEIVING'}</text>`:''}</g>`};
  return `<svg class="mini" viewBox="0 0 440 212" role="img" aria-label="Court positions: ${esc(PL(v.server).name)} serves to ${esc(PL(v.receiver).name)}">
   <defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6cd3a"/></marker></defs>
   <rect x="2" y="2" width="436" height="208" rx="10" style="fill:var(--court-out)"/>
   <rect x="20" y="16" width="400" height="180" style="fill:var(--court)" stroke="#fff" stroke-width="2"/>
   <rect x="156" y="16" width="128" height="180" fill="rgba(255,255,255,.12)"/>
   <line x1="156" y1="16" x2="156" y2="196" stroke="#fff" stroke-width="2"/><line x1="284" y1="16" x2="284" y2="196" stroke="#fff" stroke-width="2"/>
   <line x1="20" y1="106" x2="156" y2="106" stroke="#fff" stroke-width="2"/><line x1="284" y1="106" x2="420" y2="106" stroke="#fff" stroke-width="2"/>
   <text x="188" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)" font-weight="700">KITCHEN</text><text x="252" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)" font-weight="700">KITCHEN</text>
   <line x1="220" y1="8" x2="220" y2="204" stroke="#f4f4f0" stroke-width="4"/>
   <line x1="${sp[0]+ux*30}" y1="${sp[1]+uy*30}" x2="${rp[0]-ux*30}" y2="${rp[1]-uy*30}" stroke="#e6cd3a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arw)"/>
   ${tok.map(tk).join('')}</svg>`;

function timeline(bl,pr,di){
  const sc=sched(),day=sc.days[di],ds=hm(day.start),de=hm(day.end),xs=bl.map(b=>pr.get(b.id)).filter(x=>x&&x.n!==undefined);
  if(!bl.length)return '<p class="muted" style="margin:0">No blocks on this day.</p>';
  const lo=Math.min(ds,...xs.map(x=>x.s)),hi=Math.max(de,...xs.map(x=>x.e),ds+60),span=hi-lo,pc=v=>((v-lo)/span*100).toFixed(2)+'%';
  let ticks='';for(let h=Math.ceil(lo/60)*60;h<=hi;h+=60)ticks+=`<span class="tl-tick" style="left:${pc(h)}">${fmtT(h).replace(':00','')}</span>`;
  const nm=nowMin(),nowL=di===sc.today&&nm>=lo&&nm<=hi?`<span class="tl-now" style="left:${pc(nm)}" title="Now"></span>`:'';
  const endL=`<span class="tl-end" style="left:${pc(de)}" title="End of day"></span>`;
  return `<div class="tl"><div class="tl-row tl-head"><span></span><div class="tl-track">${ticks}</div></div>${bl.map(b=>{const x=pr.get(b.id),st=blockState(b),p=sc.plan&&sc.plan.b[b.id];
    const bar=x&&(x.n||x.done)?`<span class="tl-bar s-${x.done?'done':st==='playing'?'playing':b.hold?'hold':'plan'}" style="left:${pc(x.s)};width:max(6px,${((x.e-x.s)/span*100).toFixed(2)}%)">${x.done?'':fmtT(r5(x.s)).replace(' AM','').replace(' PM','')}</span>`:'<span class="tl-none">no games yet</span>';
    const ghost=p&&p.day===di?`<span class="tl-ghost" style="left:${pc(p.s)};width:${((p.e-p.s)/span*100).toFixed(2)}%" title="Saved plan"></span>`:'';
    return `<div class="tl-row"><span class="tl-l">${esc(blockName(b))}</span><div class="tl-track">${ghost}${bar}${nowL}${endL}</div></div>`}).join('')}
    <div class="tl-key"><span><i class="k-plan"></i>Estimate</span><span><i class="k-playing"></i>Playing</span><span><i class="k-done"></i>Finished</span>${sc.plan?'<span><i class="k-ghost"></i>Saved plan</span>':''}<span><i class="k-now"></i>Now</span><span><i class="k-end"></i>End of day</span></div></div>`;
}

const CSV_HEAD='Division,P1 Name,P1 Gender,P1 Birth Year,P1 DUPR,P1 DUPR ID,P1 Self Rating,P1 Mobile,P2 Name,P2 Gender,P2 Birth Year,P2 DUPR,P2 DUPR ID,P2 Self Rating,P2 Mobile';
function parseCSV(text){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function personFrom(get,pre,type){
  const name=(get(pre+' Name')||'').trim();if(!name)return null;
  const g=(get(pre+' Gender')||'').trim().toUpperCase()[0];
  const num=v=>{v=parseFloat(v);return isNaN(v)?null:v};
  const r=num(get(pre+' DUPR')),self=num(get(pre+' Self Rating'));
  const o={name,g:g==='F'||g==='W'?'F':'M',by:parseInt(get(pre+' Birth Year'),10)||null,dupr:(get(pre+' DUPR ID')||'').trim(),mobile:(get(pre+' Mobile')||'').trim(),self:self??(r?Math.round(r*2)/2:3)};
  if(type==='singles')o.s=r;else o.d=r;
  return o;
}

function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return{n:0,errs:['Paste the header row and at least one entry.']};
  const head=rows[0].map(h=>h.trim().toLowerCase()),errs=[];let n=0;
  if(!head.includes('division')||!head.includes('p1 name'))return{n:0,errs:['The first row must be the header, with at least "Division" and "P1 Name".']};
  rows.slice(1).forEach((r,k)=>{const get=h=>{const i=head.indexOf(h.toLowerCase());return i<0?'':r[i]||''};
    const dv=get('Division').trim().toLowerCase(),d=S.divs.find(x=>dname(x).toLowerCase()===dv);
    if(!d){errs.push('Row '+(k+2)+': no division named "'+get('Division')+'"');return}
    if(d.status!=='open'){errs.push('Row '+(k+2)+': '+dname(d)+' draw is already locked');return}
    const p1=personFrom(get,'P1',d.type),p2=d.type==='doubles'?personFrom(get,'P2',d.type):null;
    if(!p1||(d.type==='doubles'&&!p2)){errs.push('Row '+(k+2)+': missing player name');return}
    addEntry(d.id,p2?[p1,p2]:[p1],'CSV row '+(k+2));n++});
  audit('Admin','Imported '+n+' entries from CSV');return{n,errs};
}
function withdraw(e){e.status='out';e.seed=null;const d=D(e.div);const w=S.entries.find(x=>x.div===d.id&&x.status==='wait');if(w&&active(d.id).length<d.cap){w.status='in';audit('System',ename(w.id)+' moved off the waitlist in '+dname(d))}audit('Admin','Withdrew '+ename(e.id)+' from '+dname(d))}

  create(f){return{type:'tournament',id:f.id,offset:0,seq:0,t:{name:f.name,venue:f.venue,dates:f.date},cfg:{forfeit:f.forfeit,rest:f.rest,gameMin:f.gameMin},
    divs:[],entries:[],matches:[],audit:[],ui:{},courts:Array.from({length:f.courts},(_,i)=>({no:i+1,state:'free',match:null,hold:false}))}},
  summary(ev){return ev.divs.length+' division'+(ev.divs.length===1?'':'s')+' · '+ev.entries.filter(e=>e.status==='in').length+' entries · '+ev.matches.filter(m=>m.status==='done'&&m.result!=='bye').length+'/'+ev.matches.filter(m=>m.result!=='bye').length+' matches'}
};

})();
App.start();
</script>
