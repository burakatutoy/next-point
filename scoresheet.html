<style>
/* Layout: one phone-width column; setup form → game setup → rally scorer → result. Same visual system as Paddle Stack. */
:root{

  --teamA:#cfe2f2; --teamA-ink:#123a57; --teamB:#f5dcc7; --teamB-ink:#5a2a0a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#17201e; --surface-2:#1c2624; --ink:#e4ebe8; --muted:#94a39c; --line:#2b3633;
  --accent:#6eaedc; --accent-ink:#0b1a24; --accent-soft:#1a2f3e;
  --ball:#e6cd3a; --ball-soft:#3a3412; --ball-ink:#f6eaa2;
  --court:#24577a; --court-out:#2c5a45; --good:#6cc391; --good-soft:#173628; --warn:#f0a06c; --warn-soft:#3e2516; --bad:#f08a82; --bad-soft:#3f1b19;
  --teamA:#24465f; --teamA-ink:#d6ebfa; --teamB:#553218; --teamB-ink:#fbe1cc;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#17201e; --surface-2:#1c2624; --ink:#e4ebe8; --muted:#94a39c; --line:#2b3633;
  --accent:#6eaedc; --accent-ink:#0b1a24; --accent-soft:#1a2f3e;
  --ball:#e6cd3a; --ball-soft:#3a3412; --ball-ink:#f6eaa2;
  --court:#24577a; --court-out:#2c5a45; --good:#6cc391; --good-soft:#173628; --warn:#f0a06c; --warn-soft:#3e2516; --bad:#f08a82; --bad-soft:#3f1b19;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.clock{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}

.top-in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700;white-space:nowrap;flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--muted);flex:none}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.sync[data-s=wait] i{background:var(--ball)}.sync[data-s=off] i{background:var(--muted)}.waitnote{padding:8px 10px;border-radius:8px;background:var(--surface-2)}.sync[data-s=err] i{background:var(--bad)}.sync[data-s=err]{color:var(--bad)}
.sync[data-s=ok] b{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.top-in .meta{margin-left:auto;flex:1 1 0;font-size:12.5px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main.wrap{padding-block:14px 40px;display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.tb{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:500;width:100%}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px;min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.big{padding:14px;font-size:15px}
.btn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:not([disabled]):active{transform:scale(.97);filter:brightness(.94)}

.p-play{background:var(--accent-soft);color:var(--accent)}

.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.sidebox.b{background:var(--teamB);color:var(--teamB-ink)}

.call{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;letter-spacing:.02em}
.callsub{font-size:13.5px}
.mini{width:100%;height:auto;display:block}
.endlabels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:8px}
.endlabels span{padding:2px 8px;border-radius:99px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta{background:var(--teamA);color:var(--teamA-ink)}
.tbm{background:var(--teamB);color:var(--teamB-ink)}

.rallybtns .tbm{border-color:color-mix(in srgb,var(--teamB-ink) 40%,transparent)}

.b-to{background:var(--warn-soft);color:var(--warn)}
.b-over{background:var(--good-soft);color:var(--good)}

.scoreline{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.infoline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
details.rules summary{cursor:pointer;font-weight:700;font-size:13px}
details.rules ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:12.5px}
.result{text-align:center;display:grid;gap:6px;padding:16px;border-radius:12px;background:var(--good-soft);color:var(--good)}
.result .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;color:var(--ink)}
.result .sc{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.li-t{font-weight:600;overflow-wrap:anywhere}
.li-m{font-size:12px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;width:min(460px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h3{font-family:var(--f-display);font-size:24px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}

textarea.copybox{width:100%;font:12px/1.4 ui-monospace,monospace}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.call{font-size:56px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- court drawing ---------- */
function courtSVG(){
  const L=M().live,v=view(),leftTeam=L.aLeft?'a':'b';
  const P=(s,court)=>{const half=s===leftTeam?'L':'R';let x=half==='L'?88:352,y=((half==='L')===(court==='right'))?146:66;if(L.flip){x=440-x;y=212-y}return[x,y]};
  const tok=[];
  ['a','b'].forEach(s=>{if(!dbl())tok.push({s,p:s+'0',xy:P(s,v.side)});else{const r=rightP(L,s);tok.push({s,p:r,xy:P(s,'right')},{s,p:partner(r),xy:P(s,'left')})}});
  const sp=tok.find(t=>t.p===v.server).xy,rp=tok.find(t=>t.p===v.receiver).xy;
  const dx=rp[0]-sp[0],dy=rp[1]-sp[1],len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const tk=t=>{const[x,y]=t.xy,col=t.s==='a'?'A':'B',isS=t.p===v.server,isR=t.p===v.receiver;
    return `<g><circle cx="${x}" cy="${y}" r="21" style="fill:var(--team${col})" stroke="${isS?'#e6cd3a':isR?'#ffffff':'rgba(0,0,0,.25)'}" stroke-width="${isS||isR?4:1}" ${isR?'stroke-dasharray="5 4"':''}/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--team${col}-ink)">${esc(ini(t.p))}</text>
      ${isS?`<circle cx="${x+17}" cy="${y-17}" r="7" fill="#e6cd3a" stroke="#2a2400" stroke-width="1.5"/>`:''}
      <text x="${x}" y="${y+36}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">${esc(short(t.p))}</text>
      ${isS||isR?`<text x="${x}" y="${y+49}" text-anchor="middle" font-size="10" font-weight="700" fill="${isS?'#f3df6a':'#ffffff'}">${isS?'SERVING':'RECEIVING'}</text>`:''}</g>`};
  return `<svg class="mini" viewBox="0 0 440 212" role="img" aria-label="${esc(pname(v.server))} serves to ${esc(pname(v.receiver))}">
   <defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6cd3a"/></marker></defs>
   <rect x="2" y="2" width="436" height="208" rx="10" style="fill:var(--court-out)"/>
   <rect x="20" y="16" width="400" height="180" style="fill:var(--court)" stroke="#fff" stroke-width="2"/>
   <rect x="156" y="16" width="128" height="180" fill="rgba(255,255,255,.12)"/>
   <line x1="156" y1="16" x2="156" y2="196" stroke="#fff" stroke-width="2"/><line x1="284" y1="16" x2="284" y2="196" stroke="#fff" stroke-width="2"/>
   <line x1="20" y1="106" x2="156" y2="106" stroke="#fff" stroke-width="2"/><line x1="284" y1="106" x2="420" y2="106" stroke="#fff" stroke-width="2"/>
   <text x="188" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)" font-weight="700">KITCHEN</text><text x="252" y="190" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.7)" font-weight="700">KITCHEN</text>
   <line x1="220" y1="8" x2="220" y2="204" stroke="#f4f4f0" stroke-width="4"/>
   <line x1="${sp[0]+ux*30}" y1="${sp[1]+uy*30}" x2="${rp[0]-ux*30}" y2="${rp[1]-uy*30}" stroke="#e6cd3a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arw)"/>
   ${tok.map(tk).join('')}</svg>`;
}


/* ---------- screens ---------- */
function setupScreen(){
  const c=prefs.cfg||{type:'doubles',fmt:'1-11',timer:15,switchEnds:true,label:'',court:''};
  const pre=prefs.rematch||null;
  const pv=(s,i)=>esc(pre?pre[s][i]||'':'');
  const open=metas.filter(x=>x.mode==='tour'&&x.status==='play');
  return `${open.length?`<section class="panel"><h2>In progress on this phone</h2><ul class="list">${open.map(x=>`<li><div style="min-width:0"><div class="li-t">${esc(x.teams.a.join(' / '))} <span class="muted">vs</span> ${esc(x.teams.b.join(' / '))}</div><div class="li-m">${esc([x.cfg.label,x.cfg.court?'Court '+x.cfg.court:''].filter(Boolean).join(' · '))}</div></div><button class="btn primary sm" data-act="resume" data-id="${esc(x.id)}">Resume</button></li>`).join('')}</ul></section>`:''}
   <section class="panel"><h2>New match</h2>
   <form id="newMatch" style="display:grid;gap:10px">
    <div class="seg"><label><input type="radio" name="mType" value="singles" ${c.type==='singles'?'checked':''}><span>Singles</span></label><label><input type="radio" name="mType" value="doubles" ${c.type!=='singles'?'checked':''}><span>Doubles</span></label></div>
    <div class="grid2"><label class="f">Event or division (optional)<input type="text" id="mLabel" value="${esc(c.label)}" placeholder="e.g. Men's Doubles 18+"></label><label class="f">Court (optional)<input type="text" id="mCourt" value="${esc(c.court)}" placeholder="e.g. 3"></label></div>
    <div class="grid2"><label class="f">Format<select id="mFmt">${[['1-11','1 game to 11'],['1-15','1 game to 15'],['1-21','1 game to 21'],['3-11','Best of 3 to 11'],['3-15','Best of 3 to 15']].map(([v,l])=>`<option value="${v}" ${c.fmt===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">Game ends<select id="mWin"><option value="cap" ${c.w2?'':'selected'}>First to the target (11–10 wins)</option><option value="w2" ${c.w2?'selected':''}>Win by 2 (12–10, 13–11…)</option></select></label>
    <label class="f">Game timer (min, 0 = off)<input type="number" id="mTimer" min="0" max="90" value="${c.timer}"></label></div>
    <label class="check"><input type="checkbox" id="mSwitch" ${c.switchEnds?'checked':''}> Switch ends at the halfway score</label>
    <div class="sidebox a"><span class="eyebrow">Side A</span><label class="f" style="color:inherit">Player 1<input type="text" id="a0" value="${pv('a',0)}" autocomplete="off"></label><label class="f dblonly" style="color:inherit">Player 2<input type="text" id="a1" value="${pv('a',1)}" autocomplete="off"></label></div>
    <div class="sidebox b"><span class="eyebrow">Side B</span><label class="f" style="color:inherit">Player 1<input type="text" id="b0" value="${pv('b',0)}" autocomplete="off"></label><label class="f dblonly" style="color:inherit">Player 2<input type="text" id="b1" value="${pv('b',1)}" autocomplete="off"></label></div>
    <div class="err" id="nmErr"></div>
    <button class="btn primary big" type="submit">Set up game 1</button>
   </form></section>
   ${histPanel()}`;
}
function histPanel(){
  const h=doneList().reverse();
  return `<section class="panel"><h2>Finished matches <small>${h.length} on this phone</small></h2>
   ${h.length?`<ul class="list">${h.map(e=>`<li><div style="min-width:0"><div class="li-t">${esc(e.winner==='a'?e.a:e.b)} <span class="muted">def.</span> ${esc(e.winner==='a'?e.b:e.a)}</div>
     <div class="li-m">${e.games.map(g=>e.winner==='a'?g[0]+'–'+g[1]:g[1]+'–'+g[0]).join(', ')}${e.result!=='played'?' · '+e.result:''} · ${[e.label,e.court?'Court '+e.court:''].filter(Boolean).map(esc).join(' · ')}${e.label||e.court?' · ':''}${when(e.at)}</div>${e.notes?`<div class="li-m">Note: ${esc(e.notes)}</div>`:''}</div>
     <div class="row"><button class="btn sm" data-act="copyOne" data-id="${e.id}">Copy</button><button class="btn sm danger" data-act="delOne" data-id="${e.id}" aria-label="Delete">✕</button></div></li>`).join('')}</ul>
     <div class="row"><button class="btn" data-act="copyAll">Copy all results</button><button class="btn danger" data-act="clearModal">Clear list</button></div>`
    :'<p class="muted" style="margin:0">Results show here after each match, so you can copy them to the desk or a group chat.</p>'}</section>`;
}
function rulesCard(){
  const c=M().cfg;
  return `<details class="rules panel"><summary>Quick rules</summary><ul>
   ${dbl()?'<li>Call the score as <b>server score – receiver score – server number</b>. The game starts at <b>0–0–2</b>: only one server on the first turn.</li><li>The server serves from the <b>right</b> when their side\'s score is even and from the <b>left</b> when odd. Only the serving side switches places, and only after winning a point.</li><li>After a side out, the first server is the player on the right.</li>':'<li>Call the score as <b>server score – receiver score</b>.</li><li>Serve from the <b>right</b> when the server\'s score is even, from the <b>left</b> when odd.</li>'}
   <li>Only the serving side scores. The receiver is diagonally opposite the server.</li>
   ${c.switchEnds?`<li>Switch ends when a side first reaches ${switchAt(c.to)}${c.bo>1?' in the deciding game. Sides also switch ends between games':''}.</li>`:''}
   <li>${toLimit(c.to)} timeouts per side per game, 1 minute each.</li><li>${c.w2?'Games to '+c.to+', win by 2.':'First to '+c.to+' wins: '+c.to+'–'+(c.to-1)+' ends the game.'}</li></ul></details>`;
}
function endsRow(){const L=M().live,left=(L.aLeft!==L.flip)?'a':'b',right=oth(left),cl=s=>s==='a'?'ta':'tbm';return{left,right,html:`<div class="endlabels"><span class="${cl(left)}">${esc(sideShort(left))}</span><span class="${cl(right)}">${esc(sideShort(right))}</span></div>`}}
function gamesLine(){const m=M();return m.games.length?`<div class="scoreline">${m.games.map((g,i)=>`<span>Game ${i+1}: <b>${g[0]}–${g[1]}</b></span>`).join('')}</div>`:''}
function gameSetup(){
  const m=M(),L=m.live,e=endsRow();
  return `<section class="panel"><div class="banner">Game ${L.game} setup: choose who serves first${dbl()?' and who starts on the right':''}.</div>${gamesLine()}
   ${e.html}${courtSVG()}
   <span class="eyebrow">First serve</span><div class="grid2">${['a','b'].map(s=>`<button class="btn ${L.first===s?'on':''}" data-act="first" data-s="${s}">${esc(sideShort(s))}</button>`).join('')}</div>
   ${dbl()?['a','b'].map(s=>`<span class="eyebrow">${esc(sideShort(s))}: who starts on the right?</span><div class="grid2">${pids(s).map(p=>`<button class="btn sm ${L.sr[s]===p?'on':''}" data-act="sr" data-s="${s}" data-p="${p}">${esc(pname(p))}</button>`).join('')}</div>`).join(''):''}
   <div class="grid2"><button class="btn" data-act="ends">Swap ends</button><button class="btn" data-act="flip">Turn view around</button></div>
   <button class="btn primary big" data-act="startGame">Start game ${L.game} · first call ${dbl()?'0–0–2':'0–0'}</button>
   <div class="row">${tour()?'<button class="btn sm" data-act="back">Back to my matches</button>':'<button class="btn sm" data-act="editMatch">Change players or format</button><button class="btn sm danger" data-act="earlyModal">Forfeit…</button>'}</div></section>${rulesCard()}`;
}
function scoring(){
  const m=M(),L=m.live,c=m.cfg,v=view(),e=endsRow(),lim=toLimit(c.to),ps=pointState(),toLive=L.toUntil&&L.toUntil>now(),tl=tmLeft(L);
  const btn=s=>`<button class="btn ${s==='a'?'ta':'tbm'}" data-act="rally" data-s="${s}" ${L.switchPrompt?'disabled':''}><small>Rally won by</small>${esc(sideShort(s))}${s===v.serving?'<small>serving · point</small>':'<small>receiving · '+(dbl()&&v.num===1?'2nd server':'side out')+'</small>'}</button>`;
  return `<section class="panel">
   ${L.switchPrompt?`<div class="banner b-switch">Switch ends now. A side reached ${switchAt(c.to)}. Players keep their own left/right positions.<button class="btn sm" data-act="switched">Ends switched</button></div>`:''}
   ${toLive?`<div class="banner b-to">Timeout: ${esc(sideShort(L.toTeam))} · <span class="clock" style="font-size:18px" data-due="${L.toUntil}">${fmt(L.toUntil-now())}</span><button class="btn sm" data-act="toEnd">End timeout</button></div>`:''}
   ${L.tm.total&&tl<=0?`<div class="banner b-point">Time's up (${c.timer} min). Apply your event's time rule, then keep scoring or end the game.</div>`:''}
   ${L.tm.total?`<div class="timerbar ${tl<=0?'up':''}"><span class="eyebrow">Game timer</span><span class="clock" ${L.tm.since&&tl>0?`data-cd="${now()+tl}"`:''}>${fmt(tl)}</span><span class="pill ${L.tm.since?'p-play':'p-hold'}">${L.tm.since?'Running':'Paused'}</span><button class="btn sm ${L.tm.since?'':'primary'}" data-act="tm">${L.tm.since?'Pause':'Resume'}</button><button class="btn sm" data-act="tmReset">Reset</button></div>`:''}
   ${ps?`<div class="banner b-point">${ps}: ${esc(sideShort(v.serving))}</div>`:''}
   <div class="callbar"><span class="eyebrow">Call the score</span><div class="call num">${callText()}</div>
    <div class="callsub"><b>${esc(pname(v.server))}</b> (${dbl()?(v.num===1?'1st server':'2nd server'):'server'}) serves from the <b>${v.side}</b> to <b>${esc(pname(v.receiver))}</b></div></div>
   ${gamesLine()}${e.html}${courtSVG()}
   <div class="rallybtns">${btn(e.left)}${btn(e.right)}</div>
   <div class="tools">
    <button class="btn" data-act="undo" ${S.stack.length?'':'disabled'}>Undo rally</button>
    <button class="btn" data-act="replay">Replay rally</button>
    <button class="btn" data-act="flip">Turn view</button>
    ${['a','b'].map(s=>`<button class="btn" data-act="timeout" data-s="${s}" ${L.to[s]>=lim||toLive?'disabled':''}>Timeout ${s.toUpperCase()} · ${lim-L.to[s]} left</button>`).join('')}
    <button class="btn" data-act="fixModal">Fix score</button>
    <button class="btn" data-act="redo">Redo setup</button>
    ${tour()?'<button class="btn" data-act="back">My matches</button>':'<button class="btn danger" data-act="earlyModal">Retire / forfeit</button>\n    <button class="btn danger" data-act="abandonModal">Abandon</button>'}</div>
   <div class="infoline"><span>Game ${L.game}${c.bo>1?' of '+c.bo:''} · to ${c.to}</span><span>Rally ${L.rallies+1}</span><span>Game time <span data-since="${L.start}">${fmt(now()-L.start)}</span></span><span>A = ${esc(sideShort('a'))} · B = ${esc(sideShort('b'))}</span></div>
  </section>${rulesCard()}`;
}
function gameOver(){
  const m=M(),L=m.live,e=endsRow(),win=decided([...m.games,L.score]);
  return `<section class="panel"><div class="banner b-over">Game ${L.game} to ${esc(sideShort(L.over))}, ${Math.max(...L.score)}–${Math.min(...L.score)}.${win?' That wins the match.':''}</div>
   ${gamesLine()}${e.html}${courtSVG()}
   <p class="muted" style="margin:0">Confirm the score with both sides, then save.</p>${waitNote()}
   <div class="grid2"><button class="btn" data-act="undo">Undo last rally</button><button class="btn primary big" data-act="saveGame">${win?'Finish match':'Save game '+L.game}</button></div></section>`;
}
function resultScreen(){
  const e=meta.res;
  if(!e){setCur(null);return setupScreen()}
  const W=e.winner==='a'?e.a:e.b,Lo=e.winner==='a'?e.b:e.a;
  return `<section class="panel"><div class="result"><span class="eyebrow" style="color:inherit">${e.result==='played'?'Match won':e.result==='forfeit'?'Won by forfeit':'Won (opponent retired)'}</span>
    <div class="big">${esc(W)}</div><div class="muted">def. ${esc(Lo)}</div>
    <div class="sc num">${e.games.map(g=>e.winner==='a'?g[0]+'–'+g[1]:g[1]+'–'+g[0]).join('  ')||'—'}</div>
    <div class="tb">${[e.label,e.court?'Court '+e.court:'',e.format,e.dur?Math.round(e.dur/60000)+' min':'',e.result==='retired'&&e.note?'Retired at '+e.note:''].filter(Boolean).map(esc).join(' · ')}</div></div>
   ${tour()?`${waitNote()}<div class="grid2"><button class="btn" data-act="copyOne" data-id="${e.id}">Copy result</button><button class="btn primary" data-act="back">Back to my matches</button></div></section>`
   :`<label class="f">Notes for the desk (optional)<input type="text" id="resNotes" value="${esc(e.notes)}" placeholder="e.g. Side B disputed a line call at 9–7"></label>
   <div class="grid2"><button class="btn primary" data-act="copyOne" data-id="${e.id}">Copy result</button><button class="btn" data-act="rematch">Rematch</button></div>
   <button class="btn big" data-act="newMatch">New match</button></section>`}${histPanel()}`;
}

// quiet reminder, only while taps are still waiting to upload
function waitNote(){return tour()&&pendN?`<p class="tb waitnote" style="margin:0">${pendN} tap${pendN===1?' is':'s are'} still waiting to upload. They are safe on this phone: keep this page open until the dot turns green.</p>`:''}
// another phone holds the match: nothing can be scored here
function lockScreen(){
  const m=meta,who=m.by?esc(m.by):'';
  const head=m.free?'The desk released this match from this phone':m.claim==='lost'?'Scoring moved to another phone':'This match is being scored on another phone';
  const body=m.free?'Nobody is scoring it right now. Take it back only if the desk asks you to.'
    :m.byMine?'It is open on your other phone. Only one phone can score a match.'
    :(who||'Another referee')+' is scoring it. To take over, ask the desk to hand the match over, then tap Try again.';
  return `<section class="panel"><div class="banner b-to">${head}</div>
   <div class="li-t">${esc(sideShort('a'))} <span class="muted">vs</span> ${esc(sideShort('b'))}</div>
   <p style="margin:0">${body}</p>
   ${m.claim==='lost'&&!m.free?'<p class="tb" style="margin:0">Taps made on this phone after the move were sent to the desk as a note. They are not in the score.</p>':''}
   <div class="grid2">${m.byMine&&!m.free?'<button class="btn primary" data-act="takeModal">Move scoring to this phone</button>':`<button class="btn primary" data-act="claimRetry">${m.free?'Take it back':'Try again'}</button>`}<button class="btn" data-act="back">Back to my matches</button></div></section>`;
}

/* ---------- render ---------- */
function render(){
  if(!ready)return;
  const m=M();
  $('#meta').textContent=m?[m.cfg.label,m.cfg.court?'Court '+m.cfg.court:''].filter(Boolean).join(' · '):'';
  const keep=['a0','a1','b0','b1','mLabel','mCourt','mTimer','resNotes'].map(id=>[id,document.getElementById(id)?.value]);
  const sameScreen=$('#app').dataset.s;
  let s,h;
  if(!m){s='new';h=setupScreen()}
  else if(m.status==='done'){s='res';h=resultScreen()}
  else if(locked()){s='lock';h=lockScreen()}
  else if(m.live.setup){s='gs';h=gameSetup()}
  else if(m.live.over){s='go';h=gameOver()}
  else{s='play';h=scoring()}
  $('#app').innerHTML=h;$('#app').dataset.s=s;
  if(sameScreen===s)keep.forEach(([id,v])=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v});
  syncType();renderModal();
}
function commit(){refresh();render()}
function syncType(){const t=document.querySelector('input[name=mType]:checked');if(!t)return;document.querySelectorAll('.dblonly').forEach(el=>el.hidden=t.value!=='doubles')}


/* ---------- modals ---------- */

  const m=M();let h='';
  if(modal.t==='fix'){const L=m.live,v=view();
    h=`<h3>Fix score and positions</h3><p class="muted" style="margin:0">Correct the score or positions before the next serve.</p>
     <div class="grid2"><label class="f">${esc(sideShort('a'))}<input type="number" min="0" ${m.cfg.w2?'':'max="'+m.cfg.to+'"'} inputmode="numeric" id="fxA" value="${L.score[0]}"></label><label class="f">${esc(sideShort('b'))}<input type="number" min="0" id="fxB" value="${L.score[1]}"></label></div>
     <label class="f">Serving side<select id="fxServing"><option value="a" ${v.serving==='a'?'selected':''}>${esc(sideShort('a'))}</option><option value="b" ${v.serving==='b'?'selected':''}>${esc(sideShort('b'))}</option></select></label>
     ${dbl()?`<label class="f">Server number<select id="fxNum"><option value="1" ${v.num===1?'selected':''}>1st server</option><option value="2" ${v.num===2?'selected':''}>2nd server</option></select></label>
     <label class="f">Who is serving<select id="fxServer">${[...pids('a'),...pids('b')].map(p=>`<option value="${p}" ${p===v.server?'selected':''}>${esc(pname(p))}</option>`).join('')}</select></label>
     <label class="check"><input type="checkbox" id="fxSwapA"> Swap left/right for ${esc(sideShort('a'))}</label><label class="check"><input type="checkbox" id="fxSwapB"> Swap left/right for ${esc(sideShort('b'))}</label>`:''}
     <div class="err" id="fxErr"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveFix">Apply fix</button></div>`}
  if(modal.t==='early'){const playing=m.live&&!m.live.setup;
    h=`<h3>End match early</h3><label class="f">Which side is out?<select id="eSide"><option value="a">${esc(sideName('a'))}</option><option value="b">${esc(sideName('b'))}</option></select></label>
     <label class="f">Reason<select id="eType"><option value="forfeit">Forfeit: didn't show or can't start (scored ${m.cfg.to}–0)</option>${playing||m.games.length?'<option value="retired">Retired: stopped during the match (scores so far are kept)</option>':''}</select></label>
     <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveEarly">Confirm</button></div>`}
  if(modal.t==='abandon')h=`<h3>Abandon this match?</h3><p style="margin:0">The match is discarded and not added to Finished matches. Use Retire / forfeit instead if the match has a result.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Keep scoring</button><button class="btn primary" data-act="abandon">Abandon match</button></div>`;
  if(modal.t==='edit')h=`<h3>Change players or format?</h3><p style="margin:0">You go back to the match form with these players filled in. ${m.games.length?'Games already saved in this match are discarded.':''}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="edit">Go back</button></div>`;
  if(modal.t==='clear')h=`<h3>Clear finished matches?</h3><p style="margin:0">Removes all ${doneList().length} results from this phone. Copy them first if the desk still needs them.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="clearAll">Clear list</button></div>`;
  if(modal.t==='take')h=`<h3>Move scoring to this phone?</h3><p style="margin:0">Your other phone stops scoring this match. This phone continues from the last score that reached the server; fix the score here if the other phone was ahead.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="take">Move it here</button></div>`;
  if(modal.t==='pin')h=`<h3>Sign in to send</h3><p style="margin:0">${pendN?pendN+' tap'+(pendN===1?' is':'s are')+' waiting on this phone. ':''}Enter your staff PIN${auth&&auth.name?' ('+esc(auth.name)+')':''} to keep uploading. Scoring works without it.</p><form id="pinForm" style="display:grid;gap:10px"><label class="f">Staff PIN<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" id="pinIn"></label><div class="err" id="pinErr"></div><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Later</button><button class="btn primary" type="submit">Sign in</button></div></form>`;
  if(modal.t==='copy')h=`<h3>Copy result</h3><p class="muted" style="margin:0">Copying isn't allowed here. Select the text below and copy it.</p><textarea class="copybox" rows="6" id="copyBox" readonly>${esc(modal.text)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="close">Done</button></div>`;
  root.innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${h}</div></div>`;
  const cb=$('#copyBox');if(cb){cb.focus();cb.select()}else root.querySelector('input,select')?.focus();
}
const openModal=o=>{modal={...o,k:o.t+Math.random()};renderModal()};
const closeModal=()=>{modal=null;renderModal()};
function copy(text,ok){
  const fb=()=>openModal({t:'copy',text});
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(ok)).catch(fb);else fb()}catch(e){fb()}
}
function keepAwake(){if(M()&&M().status!=='done'&&!wake&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>wake=null)}).catch(()=>{})}}


/* ---------- events ---------- */
function keepAwake(){if(M()&&M().status!=='done'&&!wake&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>wake=null)}).catch(()=>{})}}
const buzz=()=>{try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}};
function leave(keepTeams){   // back to the match form
  const m=M();prefs.rematch=keepTeams&&m?m.teams:null;ls.set('prefs',prefs);
  if(meta&&meta.status!=='done')delMatch(meta.id);
  setCur(null);
}
document.addEventListener('click',e=>{
  keepAwake();
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act,m=M(),L=m&&m.live;
  if(a==='scrim'){if(e.target===t)closeModal();return}
  switch(a){
    case 'close':closeModal();return;
    case 'syncInfo':if(authBad&&auth&&auth.staff&&!storeBad){openModal({t:'pin'});return}toast(dotState().tip);fails=0;kick(0);return;
    case 'back':goBack();return;
    case 'resume':{const x=metas.find(y=>y.id===t.dataset.id);if(!x)return;setCur(x);refold().then(()=>{commit();setDot();kick(0)});return}
    case 'takeModal':openModal({t:'take'});return;
    case 'take':closeModal();takeOver(true);return;
    case 'claimRetry':takeOver(false);return;
    case 'first':draft().first=t.dataset.s;saveMeta(meta);break;
    case 'sr':draft().sr[t.dataset.s]=t.dataset.p;saveMeta(meta);break;
    case 'ends':{const d=draft();d.aLeft=!d.aLeft;saveMeta(meta);break}
    case 'flip':meta.flip=!meta.flip;saveMeta(meta);break;
    case 'startGame':emit('game_start',{game:L.game,first:L.first,sr:{a:L.sr.a,b:L.sr.b},aLeft:L.aLeft,cfg:coreCfg(m.cfg)});meta.draft=null;saveMeta(meta);break;
    case 'rally':if(!emit('rally',{w:t.dataset.s}))return;buzz();if(S.live.over)toast('Game over. Confirm the score, then save.');break;
    case 'undo':{const id=C.undoTarget(S);if(!id||!emit('undo',{target:id}))return;toast('Last rally undone.');break}
    case 'replay':if(emit('replay'))toast('Replay: same server, same score.');return;
    case 'switched':emit('ends_switched');break;
    case 'timeout':if(!emit('timeout',{side:t.dataset.s}))return;break;
    case 'toEnd':emit('timeout_end');break;
    case 'tm':if(L.tm.since){emit('timer',{op:'pause'});toast('Timer paused.')}else{emit('timer',{op:'resume'});toast('Timer running.')}break;
    case 'tmReset':emit('timer',{op:'reset'});toast('Timer reset. Tap Resume to start.');break;
    case 'redo':emit('game_reset');meta.draft=null;saveMeta(meta);break;
    case 'saveGame':{if(!emit('game_end',{score:[L.score[0],L.score[1]]}))return;
      if(S.status==='done'){refresh();finalize();toast('Match finished.')}else toast('Game saved. Set up game '+S.live.game+'.');break}
    case 'fixModal':openModal({t:'fix'});return;
    case 'saveFix':{const A=parseInt($('#fxA').value,10),B=parseInt($('#fxB').value,10);if(!(A>=0&&B>=0)){$('#fxErr').textContent='Enter both scores.';return}
      const er=C.scoreError(m.cfg,A,B);if(er){$('#fxErr').textContent=er;return}
      const serving=$('#fxServing').value;let server=serving+'0',num=1,swap=null;
      if(dbl()){server=$('#fxServer').value;num=+$('#fxNum').value;if(server[0]!==serving){$('#fxErr').textContent='The server must be on the serving side.';return}swap={a:$('#fxSwapA').checked,b:$('#fxSwapB').checked}}
      if(!emit('correction',{score:[A,B],serving,num,server,swap})){$('#fxErr').textContent='That fix isn\'t possible here.';return}
      closeModal();toast('Score fixed.');break}
    case 'earlyModal':openModal({t:'early'});return;
    case 'saveEarly':{const type=$('#eType').value;if(!emit('match_end',{type,loser:$('#eSide').value}))return;
      refresh();finalize();closeModal();toast('Match ended: '+(type==='forfeit'?'forfeit':'retired')+'.');break}
    case 'abandonModal':openModal({t:'abandon'});return;
    case 'abandon':leave(true);closeModal();toast('Match abandoned.');break;
    case 'editMatch':openModal({t:'edit'});return;
    case 'edit':leave(true);closeModal();break;
    case 'copyOne':{const h=doneList().find(x=>x.id===t.dataset.id);if(h)copy(resultText(h),'Result copied.');return}
    case 'copyAll':copy(doneList().map(resultText).join('\n'),'All results copied.');return;
    case 'delOne':{const id=t.dataset.id;if(meta&&meta.id===id)setCur(null);delMatch(id);break}
    case 'clearModal':openModal({t:'clear'});return;
    case 'clearAll':if(meta&&meta.status==='done')setCur(null);metas.filter(x=>x.status==='done').forEach(x=>delMatch(x.id));closeModal();toast('List cleared.');break;
    case 'rematch':leave(true);break;
    case 'newMatch':leave(false);break;
    default:return;
  }
  commit();
});
document.addEventListener('change',e=>{if(e.target.name==='mType')syncType()});
document.addEventListener('input',e=>{if(e.target.id==='resNotes'&&meta&&meta.res){meta.res.notes=e.target.value;saveMeta(meta)}});
document.addEventListener('submit',e=>{
  if(e.target.id==='pinForm'){e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;signIn(($('#pinIn').value||'').trim()).then(er=>{b.disabled=false;const el=$('#pinErr');if(er&&el)el.textContent=er});return}
  if(e.target.id!=='newMatch')return;e.preventDefault();
  const type=document.querySelector('input[name=mType]:checked').value,[bo,to]=$('#mFmt').value.split('-').map(Number);
  const g=id=>($('#'+id).value||'').trim();
  const teams={a:[g('a0')||'Player A1',g('a1')||'Player A2'],b:[g('b0')||'Player B1',g('b1')||'Player B2']};
  if(type==='singles'){teams.a=[teams.a[0]];teams.b=[teams.b[0]]}
  const timer=Math.max(0,Math.min(90,parseInt($('#mTimer').value,10)||0));
  prefs.cfg={type,fmt:$('#mFmt').value,w2:$('#mWin').value==='w2',timer,switchEnds:$('#mSwitch').checked,label:g('mLabel'),court:g('mCourt')};prefs.rematch=null;ls.set('prefs',prefs);
  const nm={id:uuid(),mode:'free',cfg:{type,bo,to,w2:prefs.cfg.w2,timer,switchEnds:prefs.cfg.switchEnds,label:prefs.cfg.label,court:prefs.cfg.court},teams,status:'play',epoch:1,flip:false,draft:null,created:now()};
  metas.push(nm);setCur(nm);S=C.init(coreCfg(nm.cfg));seq=0;saveMeta(nm);commit();window.scrollTo({top:0});
});
setInterval(()=>{
  if(!ready)return;setDot();
  document.querySelectorAll('[data-since]').forEach(el=>el.textContent=fmt(now()-(+el.dataset.since)));
  document.querySelectorAll('[data-due]').forEach(el=>{const d=(+el.dataset.due)-now();el.textContent=d>0?fmt(d):'Over';});
  let up=false;document.querySelectorAll('[data-cd]').forEach(el=>{const d=(+el.dataset.cd)-now();el.textContent=fmt(d);if(d<=0)up=true});
  const L=M()&&M().status!=='done'&&M().live,toLive=!!(L&&L.toUntil&&L.toUntil>now());
  if(toWas&&!toLive&&L&&L.toUntil&&!modal){toWas=false;render();toast('Timeout over.');return}
  toWas=toLive;
  if(up&&!lastUp&&!modal)render();lastUp=up;
},1000);
window.addEventListener('pagehide',()=>{if(idb&&journal.length)putEvents(journal.filter(e=>e.sync!==1))});

/* one scoring tab per phone: a second tab would number its taps separately */
// once opened here, the scoresheet opens again without signal (same helper as the main site)
try{if(/^https?:$/.test(location.protocol)&&window.isSecureContext&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
function start(){boot().catch(err=>{console.warn('boot',err);ready=true;refresh();render();storeErr('idb')})}
if(navigator.locks&&navigator.locks.request){
  navigator.locks.request('np-score-writer',{ifAvailable:true},lock=>{
    if(!lock){$('#app').innerHTML='<section class="panel"><h2>Already open</h2><p style="margin:0">The scoresheet is open in another tab on this phone. Use that tab, or close it and reload this page.</p><button class="btn primary" onclick="location.reload()">Reload</button></section>';return}
    start();return new Promise(()=>{});
  }).catch(start);
}else start();

})();
